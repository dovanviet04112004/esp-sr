# Bench broker for esp-sr (KEHOACH 4.7, 7.5). node.name and node.cookie come from the environment.

node {
  data_dir = "data"
}

cluster {
  name = srcl
  discovery_strategy = manual
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

# prod serves mqtts once gen_certs.sh has written certs/ and EMQX_LISTENERS__SSL__DEFAULT__ENABLE=true.
listeners.ssl.default {
  enable = false
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/sr-certs/ca.crt"
    certfile = "/opt/emqx/etc/sr-certs/broker.crt"
    keyfile = "/opt/emqx/etc/sr-certs/broker.key"
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

listeners.ws.default { enable = false }
listeners.wss.default { enable = false }

# users.csv is imported at start; an account already in the table keeps its stored password.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
    bootstrap_file = "/opt/emqx/etc/sr-users.csv"
    bootstrap_type = plain
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/sr-acl.conf"
    }
  ]
}
