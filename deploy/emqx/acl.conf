%% Topic permissions of the bench broker (KEHOACH 7.5). EMQX reads top down and stops at the first match.

%% An up topic is a board's own report, so the host may read it but never forge one.
{deny, {username, "srhost"}, publish, ["sr/+/up/#"]}.
{allow, {username, "srhost"}, subscribe, ["sr/+/up/#"]}.
{allow, {username, "srhost"}, publish, ["sr/+/down/#"]}.

%% A board logs in as its deviceId, so ${username} confines it to its own subtree.
{allow, all, publish, ["sr/${username}/up/#"]}.
{allow, all, subscribe, ["sr/${username}/down/#"]}.

{deny, all}.
