# What the chip path of speaker verification hears of a command window, and the front end of its network
# (KEHOACH 3.17): TFMelBanks of ReDimNet at the pin, as the pretrained ReDimNet2 b0 learned on it. One source for
# svc_listen, dsp_spec/spk_fbank and the ml branch speaker; a run whose front end differs is refused.
version: 1
window_s: 1.5                      # the last 1.5 s of a command window, zeros ahead of a shorter one
enrol_commands: 10                 # commands the voiceprint is the unit-length sum of, said through the board
features:                          # dsp_spec/spk_fbank, every number from b0's model_config or TFMelBanks's defaults
  frame_samples: 400               # symmetric Hamming
  hop_samples: 160                 # model_config hop_length; frames are padded by half a hop at both ends
  fft_size: 512                    # bins 0 .. fft_size / 2 - 1
  n_bands: 72                      # model_config F
  f_min_hz: 20.0
  f_max_hz: 7600.0
  preemphasis: 0.97
  eps: 1.0e-8                      # of the normalisation, both clips and the log
