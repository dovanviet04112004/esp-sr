# Board C's image path (KEHOACH 3.19, ADR-0044): the two spoken commands, the camera, and the frame of an
# image chunk on up/image. Little-endian; fields sit on their natural alignment and the generator checks offsets.
version: 1
commands:
  photo: chup_anh
  detect: nhan_dien
  journal: ghi_nhat_ki
camera:
  width: 640 # detect's frame: the whole 4:3 array, binned and scaled (KEHOACH 3.19)
  height: 480
  frame_size: FRAMESIZE_VGA
  jpeg_quality: 6
  full_width: 2560 # the picture sent home: the whole 4:3 array (KEHOACH 3.19)
  full_height: 1920
  full_frame_size: FRAMESIZE_QSXGA
  full_jpeg_quality: 12          # the best a full picture gets; the scene may need a coarser one
  full_settle_quality: 50        # settle frames at 5 MP, thrown away: never over the frame buffer
  full_quality_ladder: [12, 16, 20, 25, 32, 40, 50]
  full_size_exponent: 0.9        # size ~ quality^-0.9 at most (board_c.md 4.8)
  full_fill_max: 0.8             # of CAMERA_JPEG_MODE_FRAME_SIZE a predicted picture may take
  xclk_hz: 20000000
  settle_frames_min: 4
  settle_frames_max: 30
  still_frames: 3
  focus_timeout_ms: 3000
  preview_hold_ms: 5000
  vflip: 1
  turn_deg: 90
detect:
  decode_width: 512 # what the JPEG decoder makes of detect's frame, before the quarter turn
  decode_height: 384
  boxes_max: 32
note: # the voice note of a journal entry (KEHOACH 3.19), cleaned hops as nhan_task gets them
  start_s: 5.0 # with no speech by then the note ends empty
  end_silence_s: 1.5 # speech then this long without it ends the note
  max_s: 30.0
  buffer_s: 3.0 # sb_note: hops nhan_task may run ahead of the card
  card_block_bytes: 8192 # PCM written to the card at a time
sensors:
  period_ms: 1000
  report_s: 10
  ir_release_ms: 300 # the output chatters at milliseconds: quiet this long ends a hit
chunk:
  magic: SRIM
  payload_bytes: 16384
  flag_preview: 1
  flag_full: 2
  header:
    - {name: magic, type: u32}
    - {name: version, type: u16}
    - {name: index, type: u16}
    - {name: count, type: u16}
    - {name: flags, type: u16}
    - {name: boot, type: u32}
    - {name: seq, type: u32}
    - {name: total_bytes, type: u32}
    - {name: crc32, type: u32}
  header_bytes: 28
