# Rules of lang_vi, one source for the firmware component and its srpipe.lang mirror (KEHOACH 3.12, 4.9).
# A unit's id is its place in units; names are X-SAMPA. Any list of three values holds north (Ha Noi),
# central (Hue) and south (Sai Gon), the order of dialects and of LANG_VI_DIALECT_* bits.
version: 1
dialects: [north, central, south]
units: ["b_<", "m", "f", "v", "t", "t_h", "d_<", "n", "s", "s`", "z", "j", "z`", "l", "c", "t`", "J", "k", "x",
        "N", "G", "h", "p", "w", "a:", "a", "@", "E", "e", "i", "O", "o", "@:", "u", "M", "i@", "u@", "M@",
        "T1", "T2", "T3", "T4", "T5", "T6"]
# Tones in the order of every six-form list below: ngang, huyen, nga, hoi, sac, nang.
tones: ["T1", "T2", "T3", "T4", "T5", "T6"]
tone_marks: ["", "̀", "̃", "̉", "́", "̣"]   # combining mark of each tone (NFD)
tone_mark_aliases: {"̀": "̀", "́": "́"}          # deprecated Unicode tone marks
# Each base vowel in the six tones, lower case; upper case comes from Unicode case mapping.
vowels:
  a: [a, à, ã, ả, á, ạ]
  ă: [ă, ằ, ẵ, ẳ, ắ, ặ]
  â: [â, ầ, ẫ, ẩ, ấ, ậ]
  e: [e, è, ẽ, ẻ, é, ẹ]
  ê: [ê, ề, ễ, ể, ế, ệ]
  i: [i, ì, ĩ, ỉ, í, ị]
  o: [o, ò, õ, ỏ, ó, ọ]
  ô: [ô, ồ, ỗ, ổ, ố, ộ]
  ơ: [ơ, ờ, ỡ, ở, ớ, ợ]
  u: [u, ù, ũ, ủ, ú, ụ]
  ư: [ư, ừ, ữ, ử, ứ, ự]
  y: [y, ỳ, ỹ, ỷ, ý, ỵ]
# Combining marks that turn one base letter into another (NFD).
modifiers:
  "̂": {a: â, e: ê, o: ô}
  "̆": {a: ă}
  "̛": {o: ơ, u: ư}
# Letters that are not ASCII and not a vowel above.
extra_letters: [đ]
# Onset spellings and their unit in each dialect.
onsets:
  b: ["b_<", "b_<", "b_<"]
  c: ["k", "k", "k"]
  ch: ["c", "c", "c"]
  d: ["z", "j", "j"]
  đ: ["d_<", "d_<", "d_<"]
  g: ["G", "G", "G"]
  gh: ["G", "G", "G"]
  gi: ["z", "j", "j"]
  h: ["h", "h", "h"]
  k: ["k", "k", "k"]
  kh: ["x", "x", "x"]
  l: ["l", "l", "l"]
  m: ["m", "m", "m"]
  n: ["n", "n", "n"]
  ng: ["N", "N", "N"]
  ngh: ["N", "N", "N"]
  nh: ["J", "J", "J"]
  p: ["p", "p", "p"]
  ph: ["f", "f", "f"]
  qu: ["k", "k", "k"]
  r: ["z", "z`", "z`"]
  s: ["s", "s`", "s`"]
  t: ["t", "t", "t"]
  th: ["t_h", "t_h", "t_h"]
  tr: ["c", "t`", "t`"]
  v: ["v", "v", "j"]
  x: ["s", "s", "s"]
# Spelling by the first letter of the rhyme: k, gh, ngh need one of these letters there; c, g, ng take none.
front_only: {k: [i, e, ê, y], gh: [i, e, ê], ngh: [i, e, ê]}
never_front: {c: [i, e, ê, y], g: [i, e, ê, y], ng: [i, e, ê, y]}
no_glide: [c, k, gi]          # /kw/ is spelled qu, and gi takes no glide
# gi shares its i with a rhyme that starts with i and has no other vowel (gì, gìn), or with iê (giếng), so
# after gi the written rhyme never starts with i or y.
gi_shares_before: [ê]
gi_never_before: [i, y]
# Rhyme spellings after any onset but qu: glide, nucleus, coda; "" for none.
rhymes:
  a: ["", "a:", ""]
  ai: ["", "a:", "j"]
  ao: ["", "a:", "w"]
  am: ["", "a:", "m"]
