onset_only: [iêu, iêm, iên, iêng, iêp, iêt, iêc]
# Rhymes after qu, spelled without the u: its u is the glide, or the u of uô in quốc.
q_rhymes:
  a: ["w", "a:", ""]
  ai: ["w", "a:", "j"]
  ao: ["w", "a:", "w"]
  an: ["w", "a:", "n"]
  ang: ["w", "a:", "N"]
