  ôc: ["", "u@", "k"]
checked_codas: ["p", "t", "k", "c"]           # stops: the syllable takes only sac or nang
checked_tones: ["T5", "T6"]
# Each region's rewrites of a syllable's units, in key order; a rewrite looks at the nucleus and coda as spelled.
# glide_drops_onset: onsets the glide w silences; velar_codas skip the nuclei of velar_keep_after.
dialect_rules:
  north: {glide_drops_onset: [], velar_codas: {}, velar_keep_after: [], palatal_codas: {}, centralize: {},
          centralize_before: [], tone: {}}
  central: {glide_drops_onset: [], velar_codas: {"n": "N", "t": "k"}, velar_keep_after: ["i", "e"],
            palatal_codas: {}, centralize: {}, centralize_before: [], tone: {"T3": "T4"}}
  south: {glide_drops_onset: ["k", "h"], velar_codas: {"n": "N", "t": "k"}, velar_keep_after: ["i", "e"],
          palatal_codas: {"J": "n", "c": "t"}, centralize: {"i": "M", "e": "@"},
          centralize_before: ["n", "t", "J", "c"], tone: {"T3": "T4"}}
# Reading numbers out (KEHOACH 3.12): up to max_digits as a number, longer or with a leading 0 digit by digit.
numbers:
  digits: [không, một, hai, ba, bốn, năm, sáu, bảy, tám, chín]
  ten: mười                   # 10 to 19
  tens: mươi                  # after a tens digit of 2 to 9
  hundred: trăm
  million: triệu
  billion: tỷ
  thousand: [nghìn, ngàn, ngàn]
  zero_tens: [linh, lẻ, lẻ]   # 105: một trăm linh năm
  one_after_tens: mốt         # 21: hai mươi mốt
  four_after_tens: tư         # 24: hai mươi tư
  five_after_ten: lăm         # 15, 25: mười lăm, hai mươi lăm
  decimal_comma: phẩy
  dot: chấm
  max_digits: 12
  ordinal_word: thứ
  ordinals: {1: nhất, 4: tư}  # thứ 1, thứ 4: thứ nhất, thứ tư
symbols: {"%": phần trăm, "&": và, "+": cộng}
