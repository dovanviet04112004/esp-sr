# What the listener computes from the clean output and how it cuts speech into command windows (KEHOACH 3.11, 3.12,
# 5.4). One source for svc_listen on the board, the board simulation and every ml branch: a model learns on these
# features, and Gate 3 counts the windows the board decides.
version: 7
features:                          # log-mel of the clean output, a frame a hop
  n_bands: 80                      # one number switches every branch, the board and the simulation (ADR-0017)
  f_min_hz: 20.0
  f_max_hz: 7600.0
  log_floor: 1.0e-6                # added to the power inside the log
pitch:                             # SwiftF0 on every hop as nhan_task streams it (KEHOACH 3.11 step 3.4)
  source: swiftf0                  # the network the pitch dims come from
  int8:                            # the row of its ladder the chip runs, as models.lock.json locks it
    run: 20261028_eb08333-dirty_9ab2ce
    row: kl
  stream: true                     # dsp_spec/swift_dims's rule: the last voiced log F0 held past the look-ahead
  min_f0_hz: 50.0
  max_f0_hz: 400.0
  confidence: 0.5                  # a frame is voiced at this or above, as SwiftF0 calibrates it
  silence_peak: 0.001              # swift-f0's: a hop peaking under it, over int16 full scale, has confidence 0
  normalization_left_s: 0.75       # past of the confidence-weighted log F0 mean
  normalization_right_s: 0.4       # and its look-ahead, within the utterance gap
  pov_scale: 2.0
  pitch_scale: 2.0
  delta_pitch_scale: 10.0
kaldi_pitch:                       # dsp_spec/pitch, Kaldi's online tracker, off the listening path since 29/10: its golden and bench
  resample_hz: 4000.0              # the NCCF runs on the signal downsampled to this
  lowpass_cutoff_hz: 1000.0        # windowed sinc ahead of downsampling
  lowpass_zeros: 1
  upsample_zeros: 5                # windowed sinc from whole lags to the log-spaced ones
  window_s: 0.025                  # NCCF window; each frame also reads the longest lag past it
  min_f0_hz: 50.0
  max_f0_hz: 400.0
  soft_min_f0: 10.0                # local cost 1 - NCCF + soft_min_f0 * lag * NCCF
  penalty_factor: 0.1              # of ln^2(1 + delta_pitch) per squared lag step between frames
  delta_pitch: 0.005               # ratio between neighbouring log-spaced lags: 417 lags
  nccf_ballast: 7000.0             # times (mean square * window)^2: quiet frames get a low NCCF for tracking
  ballast_window_s: 2.0            # that mean square over the newest 2 s: hours up on board as a session in training
  normalization_left_s: 0.75       # past of the POV-weighted log-pitch mean; no right context online
  delta_window: 2                  # frames each side, the right side clamped to the newest
  pov_scale: 2.0
  pitch_scale: 2.0
  delta_pitch_scale: 10.0
utterance:                         # runs of vad into utterances and each into its command window, as Gate 3 cuts them
  gap_s: 0.4                       # vad hops this close belong to one utterance; it closes once vad is off longer
  min_s: 0.25                      # a shorter run is a breath or a click
  lead_s: 2.0                      # the window opens this far ahead of the first vad hop: the net settles in about 2 s
window_s: 3.75                     # a window's longest, the lead and 1.75 s; one longer is cut back from its end once the utterance closes
