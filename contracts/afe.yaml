# Numbers of each dsp_afe module, one source for the firmware and its srpipe mirrors (KEHOACH 3.4-3.10, 4.9).
# Units follow the fields of the module headers; module switches stay in the Kconfig of dsp_afe.
version: 1
hpf:
  cutoff_hz: 80.0
aec:
  partitions: 8
doa:
  band_min_hz: 200.0
  band_max_hz: 0.0          # 0 means the spatial alias frequency of array.yaml
  grid_step_deg: 2.0
  smooth_tau_s: 0.2
  update_every_hops: 2
gsc:
  step_size: 0.05
  leakage: 0.0001
bss:
  forget_tau_s: 1.0
vad:
  hangover_ms: 240
agc:
  up_db_per_s: 3.0
  down_db_per_s: 6.0
  limit_dbfs: -3.0
  lookahead_ms: 4.0
