# Numbers of each dsp_afe module, one source for the firmware and its srpipe mirrors (KEHOACH 3.4-3.10, 4.9).
# Units follow the fields of the module headers; module switches stay in the Kconfig of dsp_afe.
version: 1
# The modules the product turns on; firmware/sdkconfig.afe and srpipe.generated.afe.MODULES come from it.
modules: [hpf, balance, doa, ns_omlsa, vad, agc]
hpf:
  cutoff_hz: 80.0
aec:
  partitions: 8
doa:
  # Above the alias frequency the room's diffuse field decorrelates; below it pulls the angle to broadside (KEHOACH 3.6).
  band_min_hz: 2000.0
  band_max_hz: 8000.0       # 0 means the spatial alias frequency of array.yaml
  grid_step_deg: 2.0
  smooth_tau_s: 0.2
  update_every_hops: 2
gsc:
  step_size: 0.05
  leakage: 0.0001
  weight_max: 16.0                  # norm cap of each bin's weight: past 16 the scenes gain < 0.1 dB (KEHOACH 3.7)
  power_floor: 1.0e-10              # added to the block's power before the NLMS division
bss:
  forget_tau_s: 1.0
ns:
  floor_db: -12.0                     # seed of NVS afe/ns_floor_db: G_min of OM-LSA
  # OM-LSA with IMCRA (KEHOACH 3.9) as the author's omlsa.m of 2003: 'medium' non-stationarity, broadband decision,
  # no tone removal. The paper's smoothing factors at 8 ms are time constants here; at 16 ms they square.
  freq_smooth_bins: 1                 # Hann window of 2w + 1 bins over frequency
  smooth_tau_s: 0.075929773           # alpha_s 0.9
  min_subwindows: 8                   # U
  min_subwindow_s: 0.128              # V: 15 frames of 8 ms in the paper, 8 hops here
  min_bias: 1.66                      # B_min
  zeta0: 1.67
  gamma0: 4.6
  gamma1: 3.0
  noise_tau_s: 0.049225035            # alpha_d 0.85
  noise_bias: 1.4685                  # beta
  xi_tau_s: 0.022429386               # alpha_xi 0.7
  xi_local_bins: 1
  xi_global_bins: 15
  frame_band_hz: [50.0, 10000.0]      # f_l, f_u; f_u stops at Nyquist
  p_min: 0.005
  xi_local_db: [-10.0, -5.0]
  xi_global_db: [-10.0, -5.0]
  xi_frame_db: [-10.0, -5.0]
  xi_peak_db: [0.0, 10.0]             # bounds of xi_m
  local_mean_hz: [62.5, 3937.5]       # omlsa.m averages bins 3 .. k2 + k3 - 3 of its 512-point frame
  local_reset_hz: [500.0, 3500.0]
  local_reset_below: 0.25
  q_max: 0.998
  q_presence_max: 0.9                 # p is 0 where q reaches it
  eta_tau_s: 0.155965806              # alpha_eta 0.95
  eta_min_db: -18.0
  lsa_v_max: 5.0                      # above it G_H1 is Wiener's
  e1_points: 256
  power_floor: 1.0e-10
vad:
  hangover_ms: 240
  aggressiveness: 2                   # seed of NVS afe/vad_mode; agc needs it (docs/measurements/afe/agc.md)
  # WebRTC VAD in float32 (KEHOACH 3.10), its tables as real values; source in firmware/third_party/webrtc_vad.
  # Bands 0-5: 80-250, 250-500, 500-1k, 1-2k, 3-4k, 2-3k Hz; Gaussian tables [gaussian][band]; dB of int16 energy.
  bands: 6
  gaussians: 2
  noise_weights: [0.265625, 0.484375, 0.5625, 0.515625, 0.4140625, 0.1953125,
                  0.734375, 0.515625, 0.4375, 0.484375, 0.5859375, 0.8046875]
  speech_weights: [0.375, 0.640625, 0.3515625, 0.6796875, 0.390625, 0.3671875,
                   0.625, 0.359375, 0.6484375, 0.3203125, 0.609375, 0.6328125]
  noise_means_db: [52.640625, 38.21875, 55.1953125, 52.4609375, 52.8984375, 26.3203125,
                   59.734375, 30.1796875, 61.09375, 56.765625, 39.21875, 34.078125]
  speech_means_db: [64.890625, 78.7890625, 78.734375, 92.3671875, 92.5234375, 49.2890625,
                    74.0078125, 74.7734375, 84.9921875, 59.2265625, 63.90625, 58.4609375]
  noise_stds_db: [2.953125, 8.3125, 3.8515625, 4.546875, 5.375, 4.6328125,
                  3.703125, 5.4453125, 3.7109375, 5.375, 3.2890625, 3.5546875]
  speech_stds_db: [4.3359375, 3.9453125, 4.4296875, 4.09375, 4.5703125, 9.6171875,
                   3.9765625, 6.46875, 3.84375, 12.03125, 8.4296875, 6.640625]
  spectrum_weights: [6, 8, 10, 12, 14, 16]
  band_offset_db: [23.0, 23.0, 17.0, 11.0, 11.0, 11.0]
  # By aggressiveness 0..3, WebRTC's 20 ms column; local in log2 units, global over llr times spectrum weight.
  local_threshold: [5.25, 8.0, 19.5, 23.5]
  global_threshold: [48.0, 80.0, 260.0, 1050.0]
  min_energy: 10.0                    # sum of band energies below which the hop is not modelled
  likelihood_floor: 3.725290298461914e-09   # 2^-28: WebRTC counts an empty Q27 sum one octave under its LSB
  posterior_floor: 3.0517578125e-05         # 2^-15, below it the first Gaussian takes the whole posterior
  exponent_limit: 21.4892578125       # (x-m)^2/2s^2 beyond which a density is 0
  density_steps: 1024.0               # densities are whole multiples of 1/1024, rounded down, as WebRTC's Q10
  noise_mean_step: 0.019989013671875
  speech_mean_step: 0.20001220703125
  noise_std_step: 0.0009765625
  speech_std_step: 0.025
  floor_pull: 0.6015625               # share of the gap to the tracked minimum the noise means move each hop
  min_std_db: 3.0
  mean_min_db: [5.0, 6.0]             # per Gaussian, both classes
  noise_gaussian_max_db: [72.0, 71.0, 70.0, 69.0, 68.0, 67.0,
                          73.0, 72.0, 71.0, 70.0, 69.0, 68.0]
  # Band b of the speech model is capped by the cap of band b-1 (100 for band 0) plus 5, as in WebRTC.
  speech_gaussian_max_db: [105.0, 94.0, 94.0, 95.0, 95.0, 95.0]
  noise_mean_max_db: [72.0, 71.0, 70.0, 69.0, 68.0, 67.0]
  speech_mean_max_db: [89.0, 89.0, 90.0, 90.0, 90.0, 90.0]
  min_separation_db: [17.0, 17.0, 18.0, 18.0, 18.0, 18.0]
  separation_speech_share: 0.8125
  separation_noise_share: 0.1875
  min_track_values: 16
  min_track_window_hops: 100
  min_track_median_index: 2
  min_track_start_db: 100.0
  min_track_empty_db: 625.0
  min_smooth_first: 3.0517578125e-05
  min_smooth_down: 0.20001220703125
  min_smooth_up: 0.989990234375
  downsample_allpass: [0.6400146484375, 0.169921875]
  split_allpass: [0.6400146484375, 0.170013427734375]
  low_band_hpf_b: [0.40472412109375, -0.8094482421875, 0.40472412109375]
  low_band_hpf_a: [-0.473388671875, 0.343017578125]
  db_per_log2: 3.0102999566398120
  log2_e: 1.4426950408889634
agc:
  target_dbfs: -26.0                  # seed of NVS afe/agc_target_dbfs
  gain_min_db: -20.0                  # inputs of -50 .. -10 dBFS need -16 .. +24 dB
  gain_max_db: 30.0
  level_tau_s: 2.0                    # power mean of the speech hops at the input
  level_gate_db: 10.0                 # speech hops this far under the level are left out (P.56 uses 15.9)
  level_fall_db_per_s: 1.0            # the level sinks at this rate while every speech hop is gated out
  up_db_per_s: 3.0
  down_db_per_s: 6.0
  limit_dbfs: -3.0
  lookahead_ms: 4.0
  release_ms: 50.0                    # limiter gain back to 1, linearly
