# C dsp_spec against srpipe.dsp.spec for STFT analysis and synthesis (KEHOACH 3.14, E6-T4, E6-T8).
# Both sides run the same float32 operations in the same order (ADR-0020), so they match bit for bit with the
# default FFT, Kconfig DSP_SPEC_FFT_RADIX4; dl_fft does not.
# case_neg_* must fall outside these limits.
tensors:
  bins:
    max_abs: 0.0
    min_snr_db: 0.0
  rebuilt:
    max_abs: 0.0
    min_snr_db: 0.0
