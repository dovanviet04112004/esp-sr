# C dsp_spec against srpipe.dsp.spec for STFT analysis and synthesis (KEHOACH 3.14, E6-T4).
# Both sides are float32; the C side measured 137.2 dB on bins and 137.4 dB on rebuilt at
# e0ed592, so each floor keeps about 20 dB of margin. case_neg_* must fall outside these limits.
tensors:
  bins:
    max_abs: 1.0e-4
    min_snr_db: 115.0
  rebuilt:
    max_abs: 1.0e-5
    min_snr_db: 115.0
