# C dsp_afe bss against srpipe.dsp.afe.bss (KEHOACH 3.8, E8-T3). Both count, cluster, follow and gate in float32 in the
# same order; delays and gates come from double series of basic arithmetic (ADR-0006): the gate, the seats, the
# directions, every seat number's gate and degrees and the delayed gates match after every hop, and both outputs of
# the last. case_neg_000 has the broadside split's gates; case_neg_001 numbers the seats by rising delay;
# case_neg_002 takes its delayed gates one hop back, not history_s back; case_neg_003 seats without confirm.
tensors:
  gate:
    max_abs: 0.0
    min_snr_db: 0.0
  seats:
    max_abs: 0.0
    min_snr_db: 0.0
  directions:
    max_abs: 0.0
    min_snr_db: 0.0
  number_gate:
    max_abs: 0.0
    min_snr_db: 0.0
  number_deg:
    max_abs: 0.0
    min_snr_db: 0.0
  back_gate:
    max_abs: 0.0
    min_snr_db: 0.0
  back_kept:
    max_abs: 0.0
    min_snr_db: 0.0
  out0:
    max_abs: 0.0
    min_snr_db: 0.0
  out1:
    max_abs: 0.0
    min_snr_db: 0.0
