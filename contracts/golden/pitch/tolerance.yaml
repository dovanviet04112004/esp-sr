# C dsp_spec/pitch against srpipe.dsp.spec.pitch (KEHOACH 3.11, 3.14, E11-T8 step 3).
# Both sides are float32 and take the same Viterbi decisions; exp, log, pow and the filter tables' sin and cos
# come from each platform's C library. On the host and on board B the C matches bit for bit (max_abs 0 on every
# case); a libm that rounds one table entry differently must still pass these limits.
# case_neg_* must fall outside these limits.
tensors:
  features:
    max_abs: 1.0e-3
    min_snr_db: 80.0
  raw:
    max_abs: 1.0e-2
    min_snr_db: 80.0
