# C dsp_afe balance against srpipe.dsp.afe.balance.apply (KEHOACH 3.4, E7-T2, ADR-0005).
# Both sides take four float32 products and two sums per bin in the same order and dsp_afe builds without
# contraction (ADR-0006): the host and board B match bit for bit. A build that fuses a multiply-add strays by 1.5e-5
# on a bin of 164 and must fail here, as must case_neg_*, which multiplies by the conjugate gains (-3.5 dB).
tensors:
  output:
    max_abs: 1.0e-6
    min_snr_db: 120.0
