# C command_ctc postprocessing against srpipe.tasks.command.ctc.postproc.ctc_score (KEHOACH 3.12, 3.14, E11-T13,
# E11-T19). Both run the same float32 steps in the same order, exp by one polynomial without fused multiply-add and
# each log in double rounded to float, so log-probabilities and command scores match to the bit; choosing a command is
# discrete and matches exactly. A command no window can reach scores -inf on both sides. case_003 says one syllable of
# each command alone, which the winner's parts turn down. case_neg_000 forbids moving from one unit straight to the
# next, which the C allows; case_neg_001 leaves each frame's largest logit on; case_neg_002 scores no part.
tensors:
  log_probs:
    max_abs: 0.0
    min_snr_db: 0.0
  scores:
    max_abs: 0.0
    min_snr_db: 0.0
  decision:
    max_abs: 0.0
    min_snr_db: 0.0
