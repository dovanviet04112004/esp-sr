# C command_ctc postprocessing against srpipe.tasks.command.ctc.postproc.ctc_score (KEHOACH 3.12, 3.14, E11-T19): the
# same float32 steps in the same order, exp by one polynomial without fused multiply-add, each log in double rounded to
# float, scores divided by per_frames; streamed_* feeds frames three at a time; unreached commands score -inf on both
# sides. Windows carry reject, margin and a syllable cap; a decision's fifth field is the winner's worst syllable gap.
# case_003 says one syllable alone. Negatives: 000 no unit-to-unit move, 001 largest logit left on, 002 no part
# scored, 003 each window's own frames as divisor, 004 a blank's frames counted to the preceding unit.
tensors:
  log_probs:
    max_abs: 0.0
    min_snr_db: 0.0
  scores:
    max_abs: 0.0
    min_snr_db: 0.0
  decision:
    max_abs: 0.0
    min_snr_db: 0.0
  streamed_scores:
    max_abs: 0.0
    min_snr_db: 0.0
  streamed_decision:
    max_abs: 0.0
    min_snr_db: 0.0
