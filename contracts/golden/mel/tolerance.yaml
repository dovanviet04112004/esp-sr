# C dsp_spec against srpipe.dsp.spec for log-mel and MFCC (KEHOACH 3.14, E6-T5, E6-T8).
# Both sides run the same float32 operations in the same order, the log being the module's own (ADR-0020), so they
# match bit for bit with the default FFT, Kconfig DSP_SPEC_FFT_RADIX4; dl_fft does not. case_neg_* must fall
# outside these limits.
tensors:
  log_mel:
    max_abs: 0.0
    min_snr_db: 0.0
  mfcc:
    max_abs: 0.0
    min_snr_db: 0.0
