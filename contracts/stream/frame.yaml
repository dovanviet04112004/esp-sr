# One frame of the TCP audio stream (KEHOACH 7.4). Little-endian, header then interleaved PCM.
# Fields are ordered so every one sits on its natural alignment; the generator checks offsets.
version: 1
magic: SRST
header:
  - {name: magic, type: u32}
  - {name: version, type: u16}
  - {name: mode, type: u16}
  - {name: t_us, type: u64}
  - {name: seq, type: u32}
  - {name: channels, type: u8}
  - {name: format, type: u8}
  - {name: samples, type: u16}
header_bytes: 24
modes:
  - {id: 0, name: off, channels: 0}
  - {id: 1, name: clean, channels: 1}
  - {id: 2, name: raw, channels: 2}
  - {id: 3, name: raw_ref, channels: 3}
  - {id: 4, name: raw_ref_clean, channels: 4}
formats:
  - {id: 0, name: s16le, bytes: 2}
