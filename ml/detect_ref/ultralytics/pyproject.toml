[project]
name = "detect-ref-ultralytics"
version = "0.1.0"
description = "Ultralytics behind run.py: a server's YOLO26 model.pt exported to the ONNX of the detect chain, then checked against it"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics==8.4.193",
    "torch==2.14.0",
    "torchvision==0.29.2",
    "onnx==1.17.0",
    "onnxsim-prebuilt==0.4.39.post2",
    "onnxruntime==1.31.1",
    "numpy==2.5.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
