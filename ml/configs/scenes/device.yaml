# The board simulation of E4-T8 (KEHOACH 1.2): sessions of split items in a bank of rooms, on board B's microphones,
# through the product's chain to log-mel. python -m srpipe.scenes.device build <split file> <out> writes processed/<out>/.
name: device
seed: 20260928
rooms:                            # the bank, built once into interim/scenes/<name>/rooms/; each session draws one
  count: 512
  room_m: {x: [3.0, 8.0], y: [3.0, 7.0], z: [2.4, 3.2]}
  rt60_s: [0.15, 0.8]             # drawn uniformly per room
  rt60_tolerance: 0.1             # measured RT60 within 10% of the draw, refitting the design RT60
  rt60_fit_rounds: 3
  wall_margin_m: 0.5
  array_height_m: [0.7, 1.1]      # on a table or a shelf
  talker: {distance_m: [0.3, 4.0], height_m: [1.0, 1.8]}
  interferer: {distance_m: [0.5, 4.0], height_m: [0.3, 2.0], min_separation_deg: 0.0}
  max_tries: 500
session:
  items: 8                        # consecutive items of the split file share a room, a talker level and a noise
  lead_s: 3.0                     # room noise alone ahead of the first utterance
  gap_s: [0.4, 2.0]               # silence after each utterance, drawn per utterance
  pad_s: 0.3                      # kept on each side of an utterance in the output
talker:
  spl_1m_db: [45.0, 74.0]         # ANSI S3.5: casual 56, normal 62, raised 68, loud 75 dB SPL at 1 m; soft down to 45
  tilt_db_per_octave: [-6.0, 3.0] # a session's slope above tilt_from_hz: the enclosure's and the voice's (KEHOACH 1.2)
  tilt_from_hz: 1000.0
  jitter_db: 3.0                  # each utterance within this of its session's level
  active_below_peak_db: 40.0      # a hop counts as speech within this of the utterance's loudest hop
  edge_ramp_s: 0.01               # each utterance fades in and out over this: a clip cut from a sentence has no step
noise:
  probability: 0.85               # a session without one hears the microphones' own noise only
  snr_db: [0.0, 30.0]             # active talker over the whole noise, in the air at ch0
  pools:                          # under raw/; a session draws a pool by weight, then a file
    - {dir: noise/musan/musan/noise, glob: "**/*.wav", weight: 3}
    - {dir: noise/musan/musan/music, glob: "**/*.wav", weight: 1}
    - {dir: noise/musan/musan/speech, glob: "**/*.wav", weight: 1}
    - {dir: noise/demand, glob: "*/ch01.wav", weight: 2}
microphone:
  sensitivity_dbfs: -29.0         # INMP441: -26 dBFS sine at 94 dB SPL, on the firmware's square-wave scale
  self_noise_dbfs_a: -90.0        # INMP441: SNR 61 dBA below that sensitivity; a mixer without the board's floor (ns)
  floor:                          # board B's floor under every session of build (KEHOACH 1.2): quiet-room probes
    board: board_b
    sessions: [20261001_home_011, 20261001_home_012, 20261001_home_013]
  balance: docs/measurements/calib/board_b_balance.csv   # calib/bal of the board simulated, from the repo root
  pcm_shift: 13                   # calib/pcm_shift board B stores (E2-T5, docs/measurements/mic_array.md §2)
features: {n_bands: 40, f_min_hz: 20.0, f_max_hz: 7600.0, log_floor: 1.0e-6}
pitch:                            # dsp_spec/pitch, Kaldi's online tracker at zero latency with its defaults (KEHOACH 3.11)
  resample_hz: 4000.0             # the NCCF runs on the signal downsampled to this
  lowpass_cutoff_hz: 1000.0       # windowed sinc ahead of downsampling
  lowpass_zeros: 1
  upsample_zeros: 5               # windowed sinc from whole lags to the log-spaced ones
  window_s: 0.025                 # NCCF window; each frame also reads the longest lag past it
  min_f0_hz: 50.0
  max_f0_hz: 400.0
  soft_min_f0: 10.0               # local cost 1 - NCCF + soft_min_f0 * lag * NCCF
  penalty_factor: 0.1             # of ln^2(1 + delta_pitch) per squared lag step between frames
  delta_pitch: 0.005              # ratio between neighbouring log-spaced lags: 417 lags
  nccf_ballast: 7000.0            # times (mean square * window)^2: quiet frames get a low NCCF for tracking
  normalization_left_s: 0.75      # past of the POV-weighted log-pitch mean; no right context online
  delta_window: 2                 # frames each side, the right side clamped to the newest
  pov_scale: 2.0
  pitch_scale: 2.0
  delta_pitch_scale: 10.0
sessions_per_shard: 32
