owner:                             # the command windows of Gate 3's sessions (command.yaml eval.board) of this speaker
  spk: spk_001
  enrol: {date: "20260928", distance_cm: "100"}   # the sessions whose windows enrolment draws from
  counts: [3, 5, 10]               # windows averaged into the owner's model
  draws: 20                        # enrolment sets drawn for each count; figures are their median
impostors:                         # the split's test speakers through the board simulation, no noise source
  split: command/v1/test.txt       # under data/splits
  min_utterances: 4                # a speaker with fewer is left out
  per_speaker: 8                   # utterances of a speaker in each of their two sessions
  rooms_m: {near: [0.7, 1.3], far: [2.5, 3.5]}   # talker distance of the bank rooms each session draws from
language:                          # the extractors on Vietnamese with no board: every pair of these utterances
  corpus: speech/vivos/test/waves  # under raw/, a folder per speaker
rule:                              # KEHOACH 3.17's step to a product proposal
  impostors_passing: 0.01
  owner_kept: 0.95
window_s: [1.0, 1.5]               # edges of the window lengths the owner's figures are split by
