# The command branch (KEHOACH 3.12, ADR-0012): what both tracks share; command_kws.yaml and command_ctc.yaml hold
# each track's split, network and schedule.
unseen: [chup_anh]                 # ids of contracts/commands/default_vi.json no learning role of either track hears
speaker_split: command/v1          # under data/splits: the speaker roles both tracks keep (KEHOACH 1.3), cut by ctc
synth:                             # E11-T7 for both tracks: python -m srpipe.tasks.command.synth <set> (KEHOACH 3.12)
  ref_seconds: [4.0, 7.5]          # a reference clip lies inside this span; F5 cuts references past 12 s
  seed: 20260930                   # draws the parquet references and the voices of each negative
  false_accept: 0.01               # share of the near misses heard right that the margin threshold lets pass as a command
  forms: ["{text}", "{Text}!"]     # each command as written, and capitalised with an exclamation
  references:                      # KEHOACH 1.3: VIVOS voices only of speakers the command split keeps in train
    vivos: speech/vivos/train      # under raw/: every such speaker's first clip inside ref_seconds
    parquet:                       # corpora the command split gives to train whole
      files: data/train-*.parquet  # under raw/speech/<corpus>/
      counts: {fpt_open: 80, vlsp: 80, bud500: 150}
  quality: {frame_s: 0.01, below_peak_db: 40.0}   # clips.edges: lead and tail quieter than this under the peak
  pilot:                           # a few commands, voices and near misses to hear before the overnight run
    commands: [bat_den, tang_am_luong, dung_lai]
    presets: 5                     # the first VieNeu presets
    clones: 8                      # clone voices spread over the drawn references
    positives:
      vieneu: {forms: [0, 1], preset_seeds: [0], clone_seeds: [0]}
      f5: {forms: [0, 1], seeds: [0], speeds: [0.9, 1.1]}
    negatives_per_kind: 4          # near, opening, half and hand-picked texts each
    voices: {vieneu: 3, f5: 2}
  positives:                       # every learned command in these forms (indices into forms)
    vieneu: {forms: [0, 1], preset_seeds: [0, 1, 2], clone_seeds: [0]}
    f5: {forms: [0], seeds: [0], speeds: [0.9, 1.1]}
  negatives:                       # never a whole command; every command is each clip's rival
    misses: 1                      # corpus phrases this many syllable components from a command
    neighbours: 10                 # the commonest such phrases per command
    openings: 5                    # the commonest corpus phrases of a command's length opening with its first syllable
    phrases: [bật điện, tắt điện, bật quạt trần, đèn đẹp quá, mở cửa sổ, đóng góp, tăng ca, giảm giá, dừng xe, lại đây]
    voices: {vieneu: 12, f5: 8}    # per text, drawn with the seed; VieNeu from presets and clones
