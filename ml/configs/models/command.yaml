# The command branch (KEHOACH 3.12): a streaming acoustic model with CTC over the units of E11-T3.
split:                             # data/splits/command/<version> by python -m srpipe.tasks.command.data (KEHOACH 1.3)
  version: v1
  seed: 20260928
  unseen: [chup_anh]               # ids of contracts/commands/default_vi.json no learning role hears (E11-T13)
  corpora:                         # item prefix: the share of its speakers each role takes, train the rest
    speech/common_voice_vi/: {val: 0.05, test: 0.1}
    speech/vivos/train/: {val: 0.1}
    speech/vivos/test/: {test: 1.0}  # VIVOS's own test speakers
    speech/fpt_open/: {}           # no speaker ids: train only (KEHOACH 1.3)
    speech/vlsp/: {}
    speech/bud500/: {}
