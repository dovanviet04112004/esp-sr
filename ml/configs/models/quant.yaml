# The quantisation ladder of KEHOACH 3.14 for ESP-PPQ: rungs 1 and 2 by default, each branch overriding what it measured.
default:
  equalization: {iterations: 4, value_threshold: 0.4, opt_level: 2}   # measured on face attendance; each branch re-measures
  bias_correction: true
  calibration: kl                  # minmax, percentile, mse or kl
  int16_ops: []                    # rung 3: ESP-PPQ operation names whose weights and activations go to 16 bits
  onnx_rtol: 1.0e-4                # largest onnxruntime − torch gap allowed, as a share of an output's largest magnitude
branches:
  ns: {}
  wake: {}
  command_kws: {}
  command_ctc: {calibration: percentile}   # ADR-0015: QAT on it ships, int8 alone
  speaker: {}                      # ReDimNet2 b0 (KEHOACH 3.17): rung 1 as the default, measured in measurements/speaker.md
