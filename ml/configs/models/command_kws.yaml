# The kws track of command (KEHOACH 3.12, ADR-0012): DS-CNN over one window a utterance, classes the learned commands,
# other and silence; each hop is log-mel then pitch's POV, normalised log F0 and delta.
features: scenes/device.yaml       # the board simulation; mel and pitch a hop from contracts/listen.yaml
window_hops: 94                    # ending at the hop vad turns off after an utterance, about 1.5 s
commands: null                     # learned command ids the net tells apart, the rest are other to it; null for all
speech_commands: null              # a pilot on English keywords of Speech Commands v0.02 in place of the commands
model:
  size: S                          # a key of sizes; every size trains on the same split, seed and epochs (KEHOACH 3.12)
  first_kernel: [10, 4]            # hops by feature dims
  depthwise_kernel: [3, 3]
  sizes:                           # Zhang et al. 2017, model_size_info of the paper's code; strides as [hops, dims]
    S: {channels: 64, first_stride: [2, 2], strides: [[1, 1], [1, 1], [1, 1], [1, 1]]}
    M: {channels: 172, first_stride: [2, 1], strides: [[2, 2], [1, 1], [1, 1], [1, 1]]}
    L: {channels: 276, first_stride: [2, 1], strides: [[2, 2], [1, 1], [1, 1], [1, 1], [1, 1]]}
probe:                             # E11-T17: every size with random weights timed on board B (make ai-probe, ai-unit)
  seed: 20260930
  calib_windows: 16
  runs: 10                         # timed runs a size on the board, after one untimed
  input_mean: 0.0                  # the network reads features normalised by train's mean and deviation
  input_std: 1.0
split:                             # data/splits/command_kws/<version>: python -m srpipe.tasks.command.kws.data split (KEHOACH 1.3)
  version: v1
  seed: 20260930
  command_split: command/v1        # its train files lend ordinary speech to other, its val.txt to val
  val_voices: 0.2                  # of the TTS voices, each held out whole with its clones, as wake holds them
  other_hours: {train: 8.0, val: 1.0}   # ordinary speech for other, no sentence saying a command
  tts: true                        # E11-T7's clips; false for a pilot on real voices alone
  hf_extract: hf_extract           # raw/speech/<name>: the extract's clips, no speaker ids, so train only; null: none
  kws_vi_command:                  # the authors' own recordings, no speaker ids, so train only (DU_LIEU.md)
    folders: [speech/kws_vi_command/dataset/data_train/dataset_1s, speech/kws_vi_command/dataset/data_test/data_1s]
    other: [bat_het, tat_het]      # their phrases outside the command set
    val_folders: []                # of folders, those held out whole for val when TTS gives val no voice
    silence: speech/kws_vi_command/dataset/data_train/dataset_1s/noise   # data_test's noise repeats it byte for byte
  silence:                         # stretches of noise with no talker for the silence class
    pools:                         # under raw/, drawn by weight; the simulation's own pools hold MUSAN speech
      - {dir: noise/musan/musan/noise, glob: "**/*.wav", weight: 3}
      - {dir: noise/demand, glob: "*/ch01.wav", weight: 2}
    count: {train: 3000, val: 300}
    seconds: [1.0, 3.0]
    val_files: 0.1                 # of each pool's files, held out whole for val
simulate:                          # python -m srpipe.tasks.command.kws.data simulate, into processed/command_kws/<version>
  workers: 6
  session_items: 1                 # one utterance a session: a window never reaches the one before it
  pads_s: [1.6, 0.6]               # before: the 94-hop window, 0.75 s of pitch past in it; after: vad's 240 ms hangover
  repeats: {real: 4}               # passes of a file by its source, each in rooms and noise of its own
train:                             # python -m srpipe.tasks.command.kws.train; the GPU when present
  seed: 20260930
  batch: 128
  steps: 30000                     # the same for every size (KEHOACH 3.12); Zhang et al. ran 30000 of 100
  learning_rate: 1.0e-3
  final_learning_rate: 1.0e-5      # cosine decay to this by the last step, as wake
  late_s: 0.3                      # a said clip's window ends up to this after vad turns off: LENH's wait (KEHOACH 5.4)
  class_share: {other: 0.25, silence: 0.1}   # of a batch; the learned commands split the rest evenly
  source_share:                    # within a class; a class not listed draws its sources by their items
    other: {tts: 0.5, speech: 0.4, real: 0.1}   # near misses and half commands first
  masks: {bands: 2, band_share: 0.15, hops: 2, hop_width: 10}   # SpecAugment: masks a window, each up to this wide; bands as a share of the mel bands
  norm_batches: 64                 # unmasked batches of the stream that give each dim's mean and deviation
  eval_every: 1000                 # steps between val passes, each net saved beside the run
eval:                              # kws/cmd_reject and kws/cmd_margin, chosen on val (KEHOACH 3.12)
  reject_target: 0.95              # share of other and silence rejected, as gate 3 asks of the board sessions
  step_permille: 10                # the grid both thresholds are searched on
