# The ctc track of command (KEHOACH 3.12, ADR-0010): a streaming acoustic model with CTC over the units of E11-T3.
split:                             # data/splits/command/<version> by python -m srpipe.tasks.command.ctc.data (KEHOACH 1.3)
  version: v2
  seed: 20260928
  corpora:                         # item prefix: the share of its speakers each role takes, train the rest
    speech/common_voice_vi/: {val: 0.05, test: 0.1}
    speech/vivos/train/: {val: 0.1}
    speech/vivos/test/: {test: 1.0}  # VIVOS's own test speakers
    speech/fpt_open/: {}           # no speaker ids: train only (KEHOACH 1.3)
    speech/vlsp/: {}
    speech/bud500/: {}
  hours: {speech/vlsp/: 15, speech/bud500/: 25}   # train hours kept of a corpus, drawn with the seed; others whole
features: scenes/device.yaml       # mel then pitch's three, a hop, as the device computes them
simulate:                          # python -m srpipe.tasks.command.ctc.data simulate, into processed/command/<version>
  workers: 16
train:                             # python -m srpipe.tasks.command.ctc.train (E11-T12); the GPU when present
  seed: 20261001
  dialect: north                   # lang_vi reads every sentence so: the corpora do not record the region
  max_s: 12.0                      # a longer sentence, with its pads, is left out
  batch: 32                        # sentences a step
  steps: 40000
  learning_rate: 1.0e-3
  final_learning_rate: 1.0e-5      # cosine decay to this by the last step
  clip_norm: 5.0                   # of the gradient, against the rare sentence CTC aligns badly early on
  masks: {bands: 2, band_width: 8, hops: 4, hop_width: 15}   # SpecAugment: masks a sentence, each up to this wide
  eval_every: 2000                 # steps between val passes, each net saved beside the run
model:                             # MultiNet7's encoder frame (ADR-0013); sizes read from its weights
  front:                           # three conv2d over (hops, mel bands); pitch skips them and joins the projection
    channels: [8, 32, 48]
    kernel: [3, 3]                 # hops by bands
    hop_strides: [1, 2, 1]         # 62.5 hops/s in, 31.25 frames/s out, the CTC frame rate
    band_strides: [1, 2, 2]
  width: 128
  ff_width: 256
  stacks:                          # rate: base frames a frame of the stack spans; kernel: LiGLU's depthwise
    - {layers: 1, rate: 1, kernel: 17}
    - {layers: 2, rate: 2, kernel: 9}
    - {layers: 2, rate: 4, kernel: 5}
    - {layers: 1, rate: 2, kernel: 9}
  mixer_frames: 8                  # the causal mean the mixer projects, in frames of its stack
  norm_eps: 1.0e-5
  bypass_init: 0.5                 # share of a layer's or a stack's output over its input at the start
chunk_hops: 16                     # hops a streaming step takes: a multiple of the front's stride times the top rate
window_s: 3.0                      # LENH's longest window (KEHOACH 5.4): the decision looks this far back at most
quant:                             # python -m srpipe.tasks.command.ctc.quant ptq|int16|qat <run> (E11-T12, KEHOACH 3.14)
  seed: 20261002
  calib_sentences: 64              # train sentences of the run's split the int8 scales are drawn from
  hops: 768                        # every sentence zero-padded to this: a multiple of chunk_hops past train.max_s
  calibrations: [minmax, percentile, mse, kl]   # rung 2 of KEHOACH 3.14, one row each
  test_sentences: 2000             # of test, drawn with the seed
  reject: 300                      # δ₁ of the Gate 3 rows, ‰: float rejected 96.5% at it (measurements/command.md)
  gate_tie: 5                      # commands accepted right within this of the best tie: a standard error of 112
  layerwise_sentences: 16          # rung 3: calibration sentences ESP-PPQ's per-layer error runs over
  int16_tops: [1, 2, 4]            # rung 3: a row with each count of the worst convolutions at 16 bits
  qat:                             # rung 4, on the GPU when present
    batch: 16                      # sentences a step: the batch the trained graph is built for
    steps: 2000
    learning_rate: 3.0e-5
    final_learning_rate: 1.0e-6    # cosine decay to this by the last step
    eval_every: 500                # steps between val rows
eval:                              # python -m srpipe.tasks.command.eval ctc <run> (KEHOACH 3.12, E11-T13)
  margin: 50                       # δ₂ while δ₁ is swept, thousandths of a nat a frame, until E11-T13 tunes both
  reject_sweep: [100, 200, 300, 400, 500, 600, 800, 1000]   # δ₁ values the table shows, the same unit
esp_ppq_patches:                   # srpipe.compress.quant.esp_ppq_patches around every export of this branch
  - requantise_graph_inputs        # a layer's input read by a Conv, an Add and the bypass Sub at two scales
  - conv_caches_along_time         # the front's convolutions reached through a Slice of the features
probe:                             # E11-T12: one layer, then the whole net, random weights, on board B (make ai-probe)
  seed: 20260930
  calib_sequences: 8
  hops: 256                        # hops streamed on the board: a multiple of chunk_hops
  input_mean: 0.0                  # the network reads features normalised by train's mean and deviation
  input_std: 1.0
  norm_scale: [0.5, 1.5]           # each norm's scale drawn uniform, as training leaves it, never exactly one
  decide:                          # E11-T13: the decision of the default commands timed on board B (make ai-unit)
    runs: 10                       # timed runs, after one untimed; the window is window_s long
    thresholds: [1000, 50]         # reject and margin, thousandths of a nat a frame
  command:                         # E11-T19: windows through ai_engine_command_{begin,step,score} (make ai-unit)
    windows: 12                    # board windows of a trained run spread evenly, or random ones without
