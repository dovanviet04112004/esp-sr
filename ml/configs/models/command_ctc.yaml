# The ctc track of command (KEHOACH 3.12, ADR-0010): a streaming acoustic model with CTC over the units of E11-T3.
split:                             # data/splits/command/<version> by python -m srpipe.tasks.command.ctc.data (KEHOACH 1.3)
  version: v8                      # v7's items, its own build for the pitch_source trial (KEHOACH 3.11)
  seed: 20260928
  corpora:                         # item prefix: the share of its speakers each role takes, train the rest
    speech/common_voice_vi/: {val: 0.05, test: 0.1}
    speech/vivos/train/: {val: 0.1}
    speech/vivos/test/: {test: 1.0}  # VIVOS's own test speakers
    speech/fpt_open/: {}           # no speaker ids: train only (KEHOACH 1.3)
    speech/vlsp/: {}
    speech/lsvsc/: {}
    speech/speech_massive_vi/: {}  # speaker ids, but train only: val and test stay v6's, to compare (measurements/command.md 12.13)
    speech/vimd/: {}               # its spans (make spans NAME=vimd); speaker ids, train only like speech_massive_vi
  hours: {}                        # train hours kept of a corpus, drawn with the seed; none: every screened clip
  board:                           # command.yaml's eval.board.train sessions into train, cut as Gate 3 cuts (KEHOACH 1.3)
    min_s: 0.8                     # an utterance's vad run kept: shorter is a click, longer two commands run together
    max_s: 2.4
    repeat: 75                     # copies of their shard in each pass's order: about 1% of the sentences drawn
    noise: ["20261004_home_009#12", "20261004_home_010#7", "20261004_home_010#10"]   # runs no prompt fits: noises (measurements/command.md 11)
  commands:                        # val_commands.txt: real voices saying each learned command, never trained on (KEHOACH 3.12)
    extract: hf_extract            # raw/speech/<name>, the extract of common/extract.yaml
    per_command: 60                # clips a command at most, drawn with the seed; the extract holds 5 of "tắt quạt"
features: scenes/device.yaml       # the board simulation; mel then pitch's three a hop from contracts/listen.yaml
pitch_source:                      # the three pitch dims from SwiftF0, not Kaldi: a trial whose runs never deploy (KEHOACH 3.11)
  source: swiftf0                  # swift-f0 0.3.0, the swiftf0 extra of pyproject.toml
  confidence: 0.5                  # a frame is voiced at this or above, as SwiftF0 calibrates it
  normalization_right_s: 0.4       # the log F0 mean also reads this far ahead: within listen.yaml's utterance gap
simulate:                          # python -m srpipe.tasks.command.ctc.data simulate, into processed/command/<version>
  mel_from: v7                     # link this version's log-mel, simulate the pitch anew: same items, pitch_source alone differs
  workers: 12                      # BUD500: a worker holds ~0.56 GB with numba's code; 12 leave ~1 GB of 10, no swapping
  cut: listen                      # every file cut into the windows the board cuts (KEHOACH 1.2)
  speeds: [0.9, 1.0, 1.1]          # each train item spoken at one, drawn per item: Kaldi's speed perturbation
  train_dtype: float16             # train's features as stored: the trainer holds them so (KEHOACH 1.2)
train:                             # python -m srpipe.tasks.command.ctc.train (E11-T12); the GPU when present
  seed: 20261001
  dialect: north                   # lang_vi reads every sentence so: the corpora do not record the region
  max_s: 12.0                      # a longer sentence, with its pads, is left out
  batch: 32                        # sentences a step
  length_groups: 16                # a batch draws within one of these equal groups of the ring sorted by hops
  steps: 40000                     # about twelve draws of each train sentence of v6; v4 scored as well at 40 000 as at 100 000
  pool_gb: 4.0                     # train's features held at once, float16: v3's are about 15 GB, the machine has 10
  rotate_steps: 8                  # steps between one shard in and the oldest out: 256 sentences a shard, 32 a batch
  learning_rate: 1.0e-3
  final_learning_rate: 1.0e-5      # cosine decay to this by the last step
  clip_norm: 5.0                   # of the gradient, against the rare sentence CTC aligns badly early on
  stream:                          # a layer's stream after each block, held under a cap (KEHOACH 3.12)
    cap_rms: 32.0                  # a frame's RMS: the norm hides it from the loss, int8's one exponent a tensor does not
    weight: 1.0                    # of each squared octave above the cap, a mean over frames summed over the points
  masks: {bands: 2, band_share: 0.2, hops: 4, hop_width: 15}   # SpecAugment: masks a sentence, each up to this wide; bands as a share of the mel bands
  augment:                         # every draw new each time a sentence is batched, ahead of the masks (KEHOACH 3.12)
    tempo: [0.8, 1.6]              # said this many times as fast, pitch kept, log-uniform: train's 90th 4.9 syllables/s to 7.8
    warp_hops: 8                   # SpecAugment's time warp: one hop of the sentence moved at most this far
    tilt_db: 3.0                   # a straight slope across the mel bands, up to this at either edge
    lead_s: [0.3, 2.0]             # the window opened this far ahead of its first speech hop, uniform, at most the lead it has
    vtlp: [0.8, 1.2]               # mel axis read at centre / alpha, log-uniform: low voices as well as high (measurements/command.md 12.12)
  eval_every: 2000                 # steps between val passes, each net saved beside the run
model:                             # MultiNet7's encoder frame (ADR-0013), widened by ADR-0017
  front:                           # three conv2d over (hops, mel bands); pitch skips them and joins the projection
    channels: [8, 32, 48]
    kernel: [3, 3]                 # hops by bands
    hop_strides: [1, 2, 1]         # 62.5 hops/s in, 31.25 frames/s out, the CTC frame rate
    band_strides: [1, 2, 2]
  width: 160                       # MultiNet7's 128 and 256 times 1.25: 3.1 M parameters for its 2.0 M
  ff_width: 320
  stacks:                          # rate: base frames a frame of the stack spans; kernel: LiGLU's depthwise
    - {layers: 1, rate: 1, kernel: 17}
    - {layers: 2, rate: 2, kernel: 9}
    - {layers: 2, rate: 4, kernel: 5}
    - {layers: 1, rate: 2, kernel: 9}
  mixer_frames: 8                  # the causal mean the mixer projects, in frames of its stack
  norm_eps: 1.0e-5
  bypass_init: 0.5                 # share of a layer's or a stack's output over its input at the start
rnnt:                              # the rnnt track (KEHOACH 3.12, ADR-0016): MultiNet7's predictor and joiner on the encoder
  width: 384                       # predictor and joiner, as MultiNet7's weights read
  context: 2                       # units the stateless predictor looks back at
  ctc_weight: 0.2                  # of the CTC loss added to the RNN-T one, both per unit
  lattice_cells: 100000            # joiner lattice a step holds at once, ~4.5 KB a cell: the 4 GB GPU shares Windows
  joiner_columns: 16               # contexts the int8 joiner graph takes a run on the chip (KEHOACH 3.12)
chunk_hops: 16                     # hops a streaming step takes: a multiple of the front's stride times the top rate
quant:                             # python -m srpipe.tasks.command.ctc.quant ptq|int16|qat <run> (E11-T12, KEHOACH 3.14)
  seed: 20261002
  calib_sentences: 64              # spans of hops below from train sentence starts, the int8 scales drawn from them
  joiner_pairs: 1024               # rnnt: a calibration frame with a command tree context's prefix, drawn with the seed
  hops: 768                        # the graph's: a test sentence zero-padded to it, a calibration span this long; a multiple of chunk_hops past train.max_s
  calibrations: [minmax, percentile, mse, kl]   # rung 2 of KEHOACH 3.14, one row each
  test_sentences: 2000             # of test, drawn with the seed
  reject: 300                      # δ₁ of the Gate 3 rows, ‰: float rejected 96.5% at it (measurements/command.md)
  thresholds:                      # python -m srpipe.tasks.command.ctc.quant thresholds <run> --row <row> (KEHOACH 3.12)
    false_accept: 0.01             # of val's windows accepted as a command they do not say: speech is easier to turn down than Gate 3's near misses
    margin_sweep: [0, 25, 50, 75, 100, 150, 200]   # δ₂ against eval.reject_sweep's δ₁, ‰
    min_windows: 10                # val_commands windows a command needs to count as the worst: the extract has 1 of "tăng âm lượng"
  gate_tie: 5                      # commands accepted right within this of the best tie: a standard error of 112
  layerwise_sentences: 16          # rung 3: calibration sentences ESP-PPQ's per-layer error runs over
  int16_tops: [1, 2, 4]            # rung 3: a row with each count of the worst convolutions at 16 bits
  qat:                             # rung 4, on the GPU when present
    batch: 16                      # sentences a step: the batch the trained graph is built for
    steps: 2000
    learning_rate: 3.0e-5
    final_learning_rate: 1.0e-6    # cosine decay to this by the last step
    eval_every: 500                # steps between val rows
eval:                              # python -m srpipe.tasks.command.eval ctc <run> (KEHOACH 3.12, E11-T13)
  margin: 50                       # δ₂ while δ₁ is swept, thousandths of a nat a frame, until E11-T13 tunes both
  reject_sweep: [100, 200, 300, 400, 500, 600, 800, 1000]   # δ₁ values the table shows, the same unit
esp_ppq_patches:                   # srpipe.compress.quant.esp_ppq_patches around this branch's quantisation and export
  - requantise_graph_inputs        # a layer's input read by a Conv, an Add and the bypass Sub at two scales
  - conv_caches_along_time         # the front's convolutions reached through a Slice of the features
  - fuse_passive_ops_on_graph_inputs   # the Slices of the features take the features' scale
  - rmsnorm_as_espdl               # each norm computed and rounded as esp-dl's S3 kernel does
probe:                             # E11-T12: one layer, then the whole net, random weights, on board B (make ai-probe)
  seed: 20260930
  calib_sequences: 8
  hops: 256                        # hops streamed on the board: a multiple of chunk_hops
  input_mean: 0.0                  # the network reads features normalised by train's mean and deviation
  input_std: 1.0
  norm_scale: [0.5, 1.5]           # each norm's scale drawn uniform, as training leaves it, never exactly one
  decide:                          # E11-T13: the decision of the default commands timed on board B (make ai-unit)
    runs: 10                       # timed runs, after one untimed; the window is listen.yaml's window_s long
    thresholds: [1000, 50]         # reject and margin, thousandths of a nat a frame
  command:                         # E11-T19: windows through ai_engine_command_{begin,step,score} (make ai-unit)
    windows: 12                    # board windows of a trained run spread evenly, or random ones without
tone_flip:                         # python -m srpipe.tasks.command.ctc.tone_flip <run>: the F0-flip check (KEHOACH 3.11, E11-T23)
  points: 10                       # a tone's contour: semitones over the speaker's median F0 at even points of a voiced stretch
  voiced_share: 0.6                # a syllable Praat calls voiced on fewer of its frames is left out: creak, no clean periods
  min_voiced_s: 0.05               # and one voiced over less than this
  pad_s: 0.2                       # Praat resynthesises the syllable with this much on either side
  fade_s: 0.01                     # crossfaded back into the clip over this at both ends
  time_step_s: 0.01                # Praat's pitch step
  f0_range_hz: [75, 600]           # Praat's pitch floor and ceiling
  follows_share: 0.5               # the first syllable follows when it moves and flips at least this share of a later one
  workers: 5                       # val sessions simulated at once
  owner_set: host/sets/battat_vi.json   # owner: decided over the default commands and the TV and air-con pairs
  owner_sessions:                  # owner: the owner's bật / tắt sessions; 28/09 the cross-check, 07/10 Gate 3's day
    [20260928_home_012, 20260928_home_013, 20260928_home_014, 20260928_home_015,
     20260928_home_022, 20260928_home_023, 20260928_home_024, 20260928_home_025,
     20261007_home_001, 20261007_home_002, 20261007_home_003, 20261007_home_004,
     20261007_home_005, 20261007_home_006, 20261007_home_007, 20261007_home_008]
  owner_margin_hops: [15, 10]      # owner: raw mic 0 this far before and after an utterance's window goes to the aligner
  accept_permille: [200, 50]       # owner: δ₁ and δ₂ an utterance passes to count as accepted, thousandths of a nat
watch:                             # python -m srpipe.tasks.command.ctc.watch <run>: checkpoints as they land (KEHOACH 3.11)
  owner_every: 2                   # the owner check of tone_flip on every second checkpoint, Gate 3 on each
  poll_s: 30                       # seconds between looks for the next checkpoint
  settled_s: 5                     # a checkpoint left alone this long is written whole
