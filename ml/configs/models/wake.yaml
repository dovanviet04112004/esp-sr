# The wake network of KEHOACH 3.11. E11-T10 exports it with random weights to prove esp-dl streams it one hop at a time.
features: scenes/device.yaml       # the board simulation; the log-mel the network reads is contracts/listen.yaml's
word: "vừng ơi"                     # the product's wake word (ADR-0040, ADR-0043)
model:
  kernel: 3
  channels: 64                     # with the CTC side task it lifts real speech, 32 does not (wake.md §5)
  dilations: [1, 2, 4, 8, 16, 32]  # receptive field 1 + (kernel - 1) * 63 = 127 hops, about 2 s
probe:
  seed: 20260928
  hops: 256                        # streamed on the board, longer than the receptive field; a multiple of each step
  calib_sequences: 16
  input_mean: -8.0                 # natural-log mel energies between the 1e-6 floor and speech
  input_std: 2.0
candidates:                        # scored by python -m srpipe.tasks.wake.candidates (E11-T5); one gets chosen
  - bí đỏ ơi
  - cà pháo ơi
  - hạt tiêu ơi
  - bắp cải ơi
  - kẹo lạc ơi
  - cốm vòng ơi
  - bé bắp ơi
  - chú cuội ơi
  - tí hon ơi
  - cá bống ơi
  - củ cải ơi
  - ốc bươu ơi
  - hạt dẻ ơi
  - khoai lang ơi
  - bông gòn ơi
  - tép mỡ ơi
  - chó mực ơi
  - ông bụt ơi
  - này bí đỏ ơi
  - ê cà pháo ơi
  - chào bé bắp ơi
  - cô bé tí hon
  - bác tí hon ơi
  - hạt tiêu nhỏ ơi
  - xin chào cà pháo
synth:                             # E11-T7: clips from the engines of common/tts.yaml, each heard back before it counts
  ref_seconds: [4.0, 7.5]          # a reference clip lies inside this span; F5 cuts references past 12 s
  seed: 20260928                   # draws the parquet references and the voices of each negative
  false_accept: 0.01               # share of the near misses heard right that the margin threshold would
                                   #   let pass as the wake word (KEHOACH 4.4)
  heard_back: false                # ADR-0040: the owner heard OmniVoice and kept it; PhoWhisper mishears a
                                   #   lone short phrase (tts_engines.md 2), so every clip is kept unheard
  references:                      # KEHOACH 1.3: cloned voices come from training material only
    vivos: speech/vivos/train      # under raw/: every speaker's first clip inside ref_seconds
    parquet:                       # corpora that only ever feed training, clips spread over their files
      files: data/train-*.parquet  # under raw/speech/<corpus>/
      counts: {fpt_open: 80, vlsp: 80}   # Bud500 deleted 06/10
  pilot:                           # make eval-tts: the engines side by side on a few voices
    speakers: [VIVOSSPK01, VIVOSSPK05, VIVOSSPK12, VIVOSSPK27, VIVOSSPK40]
    vieneu: {texts: [trợ lý, Trợ lý!], preset_seeds: [0], clone_seeds: [0]}
    f5: {texts: [trợ lý], seeds: [0, 1, 2], speeds: [1.0]}
  positives:                       # every text spells the wake word
    omnivoice: {texts: [vừng ơi, Vừng ơi!], preset_seeds: [0], clone_seeds: [0, 1], speeds: [0.9, 1.1]}
  negatives:                       # a light set read by the voices of the positives, so a TTS voice is no cue (ADR-0011)
    misses: 1                      # every corpus phrase this many syllable components from the word: 6 for "trợ lý"
    openings: 10                   # the commonest corpus phrases of its length opening with its first syllable
    phrases: [vừng, ơi]            # each half said alone must not wake the device either
    voices: {omnivoice: 6}         # per phrase, drawn with the seed from designs and clones
  hard:                            # near-miss families (KEHOACH 3.11): a near onset in place of "vừng"
    onsets: [v, z, f, b_<, m]      # lang_vi onsets: v, d/gi, ph, b, m
    near_syllables: 30
    any_syllables: 0
    families: [{text: "{x} ơi", fill: near}]
    held_out: []
    voices: {omnivoice: 4}
split:                             # E11-T11: data/splits/wake/<version> by python -m srpipe.tasks.wake.data (KEHOACH 1.3)
  version: vung1
  seed: 20260928
  val_speakers: 0.2                # of VIVOS train speakers and of VieNeu presets, each held out whole with its clones
  learning: [speech/vivos/train/, speech/fpt_open/, speech/vlsp/, speech/lsvsc/, speech/vimd/]
  negative_hours: 100              # public speech drawn from learning into train_neg
  test_neg: [speech/common_voice_vi/, speech/vivos/test/]   # no reference voice came from these
  val_from_test: {speech/common_voice_vi/: 0.4}   # share of its speakers moved whole into val_neg (KEHOACH 3.11)
  hard: ["\\bơi\\b", "\\bvừng\\b"]   # real near misses mined from learning: a call with "ơi", any "vừng"
  speech_commands: null            # the TTS route of KEHOACH 3.11; Speech Commands words take {dir, negatives_from, ...}
  end_below_peak_db: 40.0          # every positive, TTS or real, ends at its last hop within this of its loudest: the
                                   #   simulation labels a clip's end, and both kinds carry silence after the word
  board:                           # eval.board.train's vad runs kept as positives (KEHOACH 3.11)
    min_s: 0.4                     # shorter is a noise
    max_s: 2.0                     # longer may be calls run together: masked from the loss
    below_nat: 3.0                 # a run this far under its session's median loudest log-mel hop is a breath or a noise
                                   #   (wake.md 12)
noise:                             # sessions of household noise alone, no talker (KEHOACH 3.11)
  split: noise3                    # data/splits/wake/<split>/ of make wake-noise-split; its sets processed/wake/<split>/
  roles: {val: 0.1, test: 0.1}     # share of the source recordings each role takes by the seed; train the rest
  seed: 20261113
  session_s: 300.0                 # one room, one agc start drawn as the board simulation draws it
  spl_1m_db: [55.0, 85.0]          # each clip over its loud hops at 1 m from its source, as talker.spl_1m_db
  gap_s: [1.0, 5.0]                # quiet between clips: the agc climbs as in a quiet room
  workers: 10                      # a build worker holds about 520 MB, a scoring one 730 MB: 10 fit a 10 GB WSL
  sessions_per_shard: 4            # small shards share the work evenly between the workers
  audioset: noise/dns/datasets/noise   # under raw/: DNS's AudioSet clips, each named by its YouTube id
  labels: noise/audioset_labels    # under raw/: AudioSet's segment lists, which give each of them its classes
  exclude: [Speech, "Male speech, man speaking", "Female speech, woman speaking", "Child speech, kid speaking",
            Conversation, "Narration, monologue", Babbling, Shout, Yell, Whispering, Singing, Music, Television,
            Radio]                 # a clip labelled so is left out: speech is val_neg's
  pools:                           # a clip goes to the first pool it matches
    - {name: door, prefix: noise/dns/datasets/noise/door_}
    - {name: squeak, prefix: noise/dns/datasets/noise/squeak_}
    - {name: dragging, prefix: noise/dns/datasets/noise/dragging_}
    - {name: friction, labels: [Rub, Squeak, Scrape, Scratch, Squish]}   # dragging's kin: its pool has 35 recordings
    - {name: footsteps, labels: ["Walk, footsteps", Run, Shuffle]}
    - {name: kitchen, labels: ["Dishes, pots, and pans", "Cutlery, silverware", Clatter]}
    - {name: saw, labels: [Sawing, Chainsaw]}
    - {name: tools, labels: [Power tool, Drill, Hammer, Jackhammer, Tools, "Filing (rasp)"]}
    - {name: knock, labels: ["Whack, thwack", Breaking, "Smash, crash", "Thump, thud", Knock, Slam, Wood]}
    - {name: beeps, labels: [Telephone, Ringtone, "Telephone bell ringing", "Telephone dialing, DTMF", "Dial tone",
                             "Busy signal", "Beep, bleep", Buzzer, Alarm, "Alarm clock", "Smoke detector, smoke alarm",
                             "Sine wave", Vibration]}   # pitched, held, cut off: an "oi" to the net (wake.md 14)
    - {name: chimes, labels: [Chime, Bell, Ding, Doorbell]}
    - {name: appliances, labels: [Microwave oven, Vacuum cleaner, "Electric shaver, electric razor"]}
    - {name: fan, prefix: noise/dns/datasets/noise/fan_}   # control: steady noise
    - {name: musan, prefix: noise/musan/musan/noise/free-sound/noise-free-sound-}   # control: noise training heard
    - {name: musan_bible, prefix: noise/musan/musan/noise/sound-bible/noise-sound-bible-}   # phones, dial tones, alarms
simulate:                          # make wake-features: python -m srpipe.tasks.wake.data simulate (E4-T8)
  split: vung1
  workers: 12                      # each holds about 450 MB; more push a 10 GB WSL into swap
  repeats: {train_pos: 8}          # passes over a file, each in other rooms, levels and noise; else 1
  train_dtype: float16             # train's features as stored: the trainer holds them so (KEHOACH 1.2)
  noise_hours: {train_noise: 20.0, val_noise: 8.0}   # sessions of noise alone, each pool an equal share
  f0:                              # f0_hz.json beside these builds: each clean clip's median F0 by Praat (KEHOACH 3.11)
    sets: [train_pos, train_hard]
    time_step_s: 0.01
    f0_range_hz: [60.0, 600.0]
train:                             # E11-T11: python -m srpipe.tasks.wake.train (KEHOACH 3.11), on the GPU when present
  split: vung1                     # processed/wake/<split>/<file> of make wake-features
  seed: 20260928
  window_hops: 256                 # one example, twice the receptive field
  warmup_hops: 128                 # a window's first hops see zero padding, not audio: no loss on them
  label_s: [0.2, 0.3]              # a positive is 1 from this long before the end of its speech to this long after
  positive_share: 0.25             # of each batch
  hard_share: 0.25                 # of each batch, from train_hard
  onset_share: 0.25                # of the negative windows, ending within onset_s of a sentence's first speech hop:
  onset_s: 2.0                     #   every positive follows a silence, so a net never shown these fires there
  noise_share: 0.25                # of the other negative windows, from train_noise: noise alone, clips stopping
  word_s: 1.2                      # a hard negative this short is a word: its window ends where a positive's label does
  word_gain_db: [0.0, 20.0]        # positive and hard windows louder by a gain drawn here: the agc leaves single words
                                   #   ~10 dB under the sentences it lifts (KEHOACH 3.11, wake.md 8)
  word_warp: [0.88, 1.12]          # and their frequencies scaled by a factor drawn here, as a voice with a shorter or
                                   #   longer vocal tract says them (VTLP); the owner's high, loud word (wake.md 12)
  word_tilt_db: [-3.0, 3.0]        # and their spectrum tilted this much an octave about 1 kHz: a loud voice leans high
  word_tempo: [0.85, 1.15]         # and their speech this many times faster, by nearest source hops
  f0_balance:                      # positive and hard words drawn so their F0 follows train_neg's (KEHOACH 3.11)
    median_hz: 167.0               # with spread_st, a log-normal through train_neg's p10/p50/p90 of 112/167/249 Hz
    spread_st: 5.4
    max_weight: 5.0                # of the mean weight: a thin stretch of F0 does not take over the draws
  label_smoothing: 0.0             # BCE targets pulled this far toward 0.5 in total; 0 keeps them 0 and 1
  real_share: 0.1                  # of those positives, from real speech: the owner's sessions, against his
                                   #   negatives' quarter of the hard draws (wake.md 12)
  batch: 128
  steps: 20000
  learning_rate: 1.0e-3
  final_learning_rate: 5.0e-5       # cosine decay to this by the last step
  eval_every: 1000                 # each evaluated net is saved; the run keeps the last (KEHOACH 3.11)
  aux:                             # CTC side task on the real sentences of train_neg (KEHOACH 3.11); weight 0 is off
    weight: 0.1                    # of the CTC loss, added to the per-hop BCE
    batch: 32                      # sentences per step, besides the wake batch
    max_s: 8.0                     # longer sentences are left out: 92% of train_neg is shorter
    dialect: north                 # lang_vi reads every sentence so: the corpora do not record the region
eval:
  smooth_hops: 5                   # the moving average ahead of the threshold (KEHOACH 3.11)
  lockout_s: 2.0                   # the device stays awake after a trigger, so a second one inside this is not counted
  false_accepts_per_hour: 3.0      # the threshold is the lowest whose val rate stays at or under this; Cửa 2 is 1,
                                   #   the demo takes more to catch the word (ADR-0011)
  thresholds: {first: 0.05, step: 0.005, fine_from: 0.99, fine_step: 0.001, last: 0.999}   # kws/wake_th is in permille
  board:                           # sessions recorded through board B, run through the same chain and log-mel
    manifest: device/board_b.csv   # under data/manifests
    pcm_shift: 13                  # the shift the product keeps (E2-T5); other sessions are left out
    train:                         # the owner's sessions to learn from, never scored (KEHOACH 1.3, 3.11)
      - 20261101_home_001          # the word at 1 m in front, twice
      - 20261101_home_002
      - 20261101_home_005          # the word at 1 m, soft
      - 20261101_home_006          # the word at 1 m, from the side
      - 20261101_home_007          # the word at 3 m in front
      - 20261101_home_009          # the word at 3 m, called loud
      - 20261101_home_012          # the word at 1 m, high and loud
      - 20260928_home_012          # hard negatives from here: the first round of commands of 28/09, "dừng lại" among them
      - 20260928_home_013
      - 20260928_home_014
      - 20260928_home_015
      - 20260928_home_016
      - 20260928_home_017
      - 20260928_home_018
      - 20260928_home_019
      - 20260928_home_020
      - 20260928_home_021
      - 20260928_home_032          # near misses of the commands
      - 20261004_home_001          # the commands of 04/10
      - 20261004_home_002
      - 20261004_home_003
      - 20261004_home_004
      - 20261004_home_005
      - 20261004_home_006
      - 20261004_home_007
      - 20261004_home_008
      - 20261004_home_009
      - 20261004_home_010
      - 20261031_home_001          # "on" and commands, said on and off for 268 s
      - 20261101_home_003          # "trợ lý" at 1 m, twice
      - 20261101_home_004
      - 20261101_home_010          # the word's near misses; none of his is left to score (wake.md 12)
  noise:                           # make wake-noise: false accepts on the noise split's test clips (KEHOACH 3.11)
    hours: 1.0                     # of each pool, in sessions of noise.session_s
quant:                             # python -m srpipe.tasks.wake.quant ptq <run>: rung 2 of KEHOACH 3.14 (E11-T11)
  seed: 20261029
  calib_windows: 64                # of train.window_hops hops, half from train_pos, half from train_neg
  calibrations: [kl, percentile, minmax, mse]   # one row each, in this order, scored as the chip scores
deploy:                            # make wake-deploy RUN= ROW=: a row into firmware/models/wake (KEHOACH 3.11)
  step_frames: 8                   # frames a call of the streaming graph; the score trails the frame fed by 7
