# The wake network of KEHOACH 3.11. E11-T10 exports it with random weights to prove esp-dl streams it one hop at a time.
features: scenes/device.yaml       # the log-mel the network reads, its n_bands among them
word: chào mi na                   # ADR-0007, read level as the name Mina is read
model:
  kernel: 3
  channels: 32
  dilations: [1, 2, 4, 8, 16, 32]  # receptive field 1 + (kernel - 1) * 63 = 127 hops, about 2 s
probe:
  seed: 20260928
  hops: 200                        # streamed on the board, longer than the receptive field
  calib_sequences: 16
  input_mean: -8.0                 # natural-log mel energies between the 1e-6 floor and speech
  input_std: 2.0
candidates:                        # scored by python -m srpipe.tasks.wake.candidates (E11-T5); one gets chosen
  - bí đỏ ơi
  - cà pháo ơi
  - hạt tiêu ơi
  - bắp cải ơi
  - kẹo lạc ơi
  - cốm vòng ơi
  - bé bắp ơi
  - chú cuội ơi
  - tí hon ơi
  - cá bống ơi
  - củ cải ơi
  - ốc bươu ơi
  - hạt dẻ ơi
  - khoai lang ơi
  - bông gòn ơi
  - tép mỡ ơi
  - chó mực ơi
  - ông bụt ơi
  - này bí đỏ ơi
  - ê cà pháo ơi
  - chào bé bắp ơi
  - cô bé tí hon
  - bác tí hon ơi
  - hạt tiêu nhỏ ơi
  - xin chào cà pháo
synth:                             # E11-T7: clips from the engines of common/tts.yaml, each heard back before it counts
  ref_seconds: [4.0, 7.5]          # a reference clip lies inside this span; F5 cuts references past 12 s
  seed: 20260928                   # draws the parquet references and the voices of each negative
  false_accept: 0.01               # share of the near misses heard right that the margin threshold would
                                   #   let pass as the wake word (KEHOACH 4.4)
  references:                      # KEHOACH 1.3: cloned voices come from training material only
    vivos: speech/vivos/train      # under raw/: every speaker's first clip inside ref_seconds
    parquet:                       # corpora that only ever feed training, clips spread over their files
      files: data/train-*.parquet  # under raw/speech/<corpus>/
      counts: {fpt_open: 80, vlsp: 80, bud500: 150}
  pilot:                           # make eval-tts: the engines side by side on a few voices
    speakers: [VIVOSSPK01, VIVOSSPK05, VIVOSSPK12, VIVOSSPK27, VIVOSSPK40]
    vieneu: {texts: [chào mi na, Chào Mina!], preset_seeds: [0], clone_seeds: [0]}
    f5: {texts: [chào mi na], seeds: [0, 1, 2], speeds: [1.0]}
  positives:                       # every text spells the wake word
    vieneu: {texts: [chào mi na, Chào Mina!], preset_seeds: [0, 1, 2], clone_seeds: [0, 1]}  # drops end punctuation
    f5: {texts: [chào mi na, chào mi na!], seeds: [0], speeds: [0.85, 1.0, 1.15]}  # clearer than VieNeu by ear
  negatives:                       # ADR-0007 near misses, read by the voices of the positives
    misses: 3                      # every corpus phrase at most this many syllable components from the word
    openings: 30                   # the commonest corpus phrases of its length opening with its first syllable
    phrases: [chào mi, mi na, mi na ơi, chào chị na, chào mi nhé]
    voices: {vieneu: 6, f5: 4}     # per phrase, drawn with the seed; VieNeu from presets and clones
  hard:                            # near-miss families the component distance misses (KEHOACH 3.11)
    onsets: [m, n, J, l, b_<, v]   # g2p onsets (nh is J, b is b_<) of the syllables filling a "near" slot
    near_syllables: 30             # the commonest corpus syllables with those onsets
    any_syllables: 15              # the commonest corpus syllables of any onset
    families:                      # {x} takes each syllable of its fill
      - {text: "chào {x}", fill: near}
      - {text: "chào mi {x}", fill: near}
      - {text: "chào {x} na", fill: near}
      - {text: "{x} mi na", fill: any}
    held_out: [chào mẹ, chào minh, chào bạn]   # board near misses v1 never learnt (host/plans/wake.tsv)
    voices: {vieneu: 4, f5: 3}     # per text, drawn with the seed as for the negatives
split:                             # E11-T11: data/splits/wake/<version> by python -m srpipe.tasks.wake.data (KEHOACH 1.3)
  version: v2
  seed: 20260928
  val_speakers: 0.2                # of VIVOS train speakers and of VieNeu presets, each held out whole with its clones
  learning: [speech/vivos/train/, speech/fpt_open/, speech/vlsp/, speech/bud500/]   # gave the reference voices
  negative_hours: 100              # public speech drawn from learning into train_neg
  test_neg: [speech/common_voice_vi/, speech/vivos/test/]   # no reference voice came from these
  hard:                            # a learning clip whose words match one of these joins the hard files (KEHOACH 3.11)
    - '\bchào [mnlbv]'           # "chào" and a syllable of a near onset
    - '\bmươi (lăm|năm|ba|nhăm)\b'  # numbers read aloud
    - 'i n[aàáảãạ]\b'             # a syllable ending in "i" before "na"
simulate:                          # make wake-features: python -m srpipe.tasks.wake.data simulate (E4-T8)
  split: v2
  workers: 12                      # each holds about 450 MB; more push a 10 GB WSL into swap
  repeats: {train_pos: 8, train_hard: 4}   # passes over a file, each in other rooms, levels and noise; else 1
train:                             # E11-T11: python -m srpipe.tasks.wake.train (KEHOACH 3.11), on the GPU when present
  split: v2                        # processed/wake/<split>/<file> of make wake-features
  seed: 20260928
  window_hops: 256                 # one example, twice the receptive field
  warmup_hops: 128                 # a window's first hops see zero padding, not audio: no loss on them
  label_s: [0.2, 0.3]              # a positive is 1 from this long before the end of its speech to this long after
  positive_share: 0.25             # of each batch
  hard_share: 0.15                 # of each batch, from train_hard when the split has it (KEHOACH 3.11)
  batch: 128
  steps: 20000
  learning_rate: 1.0e-3
  final_learning_rate: 5.0e-5       # cosine decay to this by the last step
  eval_every: 1000
eval:
  smooth_hops: 5                   # the moving average ahead of the threshold (KEHOACH 3.11)
  lockout_s: 2.0                   # the device stays awake after a trigger, so a second one inside this is not counted
  false_accepts_per_hour: 1.0      # Cửa 2: the threshold is the lowest whose rate on val_neg stays at or under this
  thresholds: {first: 0.05, last: 0.995, step: 0.005}
  board:                           # sessions recorded through board B, run through the same chain and log-mel
    manifest: device/board_b.csv   # under data/manifests
    pcm_shift: 13                  # the shift the product keeps (E2-T5); other sessions are left out
    utterance_gap_s: 0.4           # speech hops of vad this close belong to one utterance
    utterance_min_s: 0.25          # a shorter run of vad is a breath or a click
