# The chip path of KEHOACH 3.17, as command_ctc goes: the survey's pretrained ReDimNet2 b0 imported as a run of this
# branch, the ladder of 3.14 into <run>/int8/, the board probe of one row. python -m srpipe.tasks.speaker.quant
source:                            # imported as <run>/model.pt with its network's code (make speaker-import)
  survey: scenes/speaker.yaml      # under configs/: the pins, and the material the int8 rows are scored on
  extractor: redimnet2_b0
window_s: 1.5                      # the last 1.5 s of a command window, zeros ahead of a shorter one
quant:                             # python -m srpipe.tasks.speaker.quant ptq <run> (E11-T25, KEHOACH 3.14)
  seed: 20261010
  calib_windows: 64                # impostor windows ESP-PPQ calibrates on, drawn with the seed, left out of the rows
  calibrations: [kl, percentile, minmax, mse]   # rung 2, one row each, in this order
  rewrite_rtol: 1.0e-4             # largest gap of the rewritten graph to the extractor, as a share of its largest value
  check_windows: 8                 # calibration and owner windows of same-int8 (KEHOACH 3.14 step 2.4)
  gate_share: 0.05                 # 3.17's gate share: rung 2's best keeps the most in its worst group here
  layerwise_windows: 8             # rung 3: calibration windows ESP-PPQ's per-layer error runs over
  int16_tops: [2, 4, 8, 16]        # rung 3: a row with each count of the worst operations at 16 bits
  count: 10                        # enrolment windows of the figures
  shares: [0.01, 0.05]             # impostors passing at which the accepted windows kept are given per group
esp_ppq_patches:                   # srpipe.compress.quant.esp_ppq_patches around this branch's quantisation and export
  - simplify_without_bn_fusion     # onnxsim's fuse_bn breaks the shapes of b0's graph
  - fuse_erf_gelu                  # esp-dl has no Erf; b0's GELU runs as one Gelu table
  - layernorm_as_espdl             # its float32 steps, or a half step rounds unlike the chip
  - softmax_as_espdl               # attention's exp table and row sum as the chip takes them
  - fuse_tanh_gelu                 # feed-forward GELU (tanh form) as one table, not a float Pow
  - lean_transposes                # one Transpose per variable and perm, chains folded at export
  - lean_quantizers                # one QuantizeLinear per variable and grid, the Softmax's float output quantised once
  - aligned_pointwise              # 12- and 24-channel 1x1 convolutions over merged columns, on the vector path
  - copies_by_broadcast            # the stem's copies of the log-mel as an Add of zeros, not a Concat and Transpose
  - cache_sized_convolutions       # the pool's 72 KB projections as slices whose weights stay in the data cache
  - identity_convolutions_dropped  # stage 0's sum of the stem output alone, a convolution by 1, removed
  - channel_scales_as_mul          # the stage sums' per-channel weights as Muls, not depthwise convolutions
  - softmax_quant                  # each Softmax and its quantiser as one int8 op of ai_engine (after lean_quantizers)
  - softmax_scale                  # attention's scaled scores as a table the op looks up (after softmax_quant)
  - layernorm_s8                   # each int8 LayerNorm as ai_engine's op: float steps, no double mean
  - stage_sum                      # each weighted sum of stage outputs as one op of ai_engine (after channel_scales_as_mul)
  - conv_block                     # each residual conv block as one op of ai_engine run a row at a time (after aligned_pointwise)
  - matmul_s8                      # each projection by constant weights and its bias as one op of ai_engine
  - attention_core                 # each attention's heads, scores, softmax and weighing as one op (after softmax_scale)
  - stem_conv                      # the stem's broadcast copies and their depthwise as one op (after copies_by_broadcast)
  - stride_depthwise               # depthwise convolutions over 2 or 4 frames at that stride as one op of ai_engine
  - weighted_stats                 # the pool's weighted sums of x and x*x over time as one op of ai_engine
  - global_stats                   # the pool's mean over time and mean centred square as one op of ai_engine
deploy:                            # make speaker-deploy RUN= ROW= (E11-T26, KEHOACH 3.17)
  weights_in_flash: true           # the image entry stays in flash; PSRAM holds the tensors only (KEHOACH 6.6)
  shares: [0.05]                   # impostors passing: the first, unless a distance then keeps under keep_min (KEHOACH 3.17)
  keep_min: 0.95                   # accepted commands kept at each distance, its sessions pooled
  cohort_top: 100                  # cohort rows AS-norm averages over at each side (ADR-0023)
  noise:                           # the noisier bins' material (ADR-0024): scenes/device.yaml's pools
    snr_db: [20, 10, 5]            # the talker's speech hops over the whole noise at ch0
music:                             # make speaker-music RUN=: the locked row with music in the room (E11-T33)
  pool: {dir: noise/musan/musan/music, glob: "**/*.wav", weight: 1}   # under raw/, as scenes/device.yaml lists it
  snr_db: [20, 10, 5]              # the talker's speech hops over the whole music at ch0
  mixed_snr_db: 10                 # the condition the mixed voiceprint takes its music windows from
  mixed_windows: 5                 # of the 10 enrolment windows, those swapped for windows with music
  snr_bins: 4                      # "by snr": bins of equal counts of the strangers' window SNRs, a threshold each
probe:                             # E11-T25: one row's graph on board B (make ai-unit-speaker)
  runs: 10                         # timed runs on the board, after one untimed
  cuts: 4                          # copies of the graph cut at tensors spread over its ops, each model->test()ed
