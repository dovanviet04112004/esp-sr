# Desktop TTS engines and the ASR checker every branch shares (KEHOACH 1.2, 3.13); each runs in ml/tts/<name>/.
# Every model is pinned repo@revision: an engine refuses to run when the hub's main moved past its pin. The aligner
# is pinned by image tag and model version.
asr:
  model: vinai/PhoWhisper-large@b9136a44b5f2ca664bd0b8f74baecf1715f6eeeb
  batch: 1                         # 2 is 6% faster but peaks at 3.4 GB of a 4 GB card Windows shares; spilling past
                                   #   it runs 5 times slower (docs/measurements/tts_engines.md)
asr_fast:                          # the same checker on CTranslate2 int8, text only, for the extract's cuts: twice as
                                   #   fast, the same verdict on 394 of 400 cuts (tts_engines.md §4)
  model: vinai/PhoWhisper-large@b9136a44b5f2ca664bd0b8f74baecf1715f6eeeb
  quantization: int8_float16
  converter: ctranslate2==4.6.0    # added to ml/tts/asr, which holds transformers and torch, to convert once
  batch: 4                         # clips per forward; 8 runs out of a 4 GB card
align:                             # word times by forced alignment (KEHOACH 3.11), in Docker as the aligner needs Kaldi
  image: mmcauliffe/montreal-forced-aligner:v3.4.2
  acoustic: vietnamese_mfa         # CC BY 4.0; learned on Common Voice 17, VIVOS and GlobalPhone
  dictionary: vietnamese_mfa       # readings of the three regions
  version: 3.0.0                   # of both models
  jobs: 4                          # aligner processes; with the checker, scan and fetch they share 10 GB
engines:
  vieneu:                          # preset voices, and clones of a reference clip
    checkpoint: pnnbao-ump/VieNeu-TTS-v3-Turbo@61b85e3d937fbbacb387714180e8182823512523
    codec: OpenMOSS-Team/MOSS-Audio-Tokenizer-Nano@6aa02b01e445cc585582cf0ba480bc3ea6c8dd68
    dtype: float32                 # the checkpoint's own precision; the GPU default of bfloat16 rounds it
  f5:                              # clones only, from a reference clip and its text
    checkpoint: hynt/F5-TTS-Vietnamese-ViVoice@5c14cdd4e3f62b69e75140558bea2b2e293ee8f1
    vocoder: charactr/vocos-mel-24khz@0feb3fdd929bcd6649e0e7c5a688cf7dd012ef21
