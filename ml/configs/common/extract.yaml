# Clips of real voices saying a phrase, cut from Vietnamese speech corpora on Hugging Face (KEHOACH 1.2):
# python -m srpipe.core.extract <name> {scan,fetch,cut} [--follow]: run the three at once, fetch and cut with
# --follow, to pipeline them. Every step resumes where a stopped run left off.
http:
  hub: https://huggingface.co        # every listing and file of a source is read from here
  token_env: HF_TOKEN              # from ml/.env or the environment; gated corpora need an account that took their terms
  read_ahead_bytes: 65536          # least bytes per range request: a row group's text is ~12 KB between MBs of audio
  file_parallel: 8                 # range requests at once within one parquet file: each waits ~0.8 s on a US edge
  stream_buffer_bytes: 1048576    # read size of a streamed file: a line at a time would be a call per byte
  retries: 6                       # of a request that fails, each after twice the wait of the one before
  first_wait_s: 2.0
  timeout_s: 180.0
workers:
  scan: 32                         # text files read at once, each file_parallel requests at a time
  fetch: 6                         # audio parts streamed at once: one stream runs at ~16 MB/s; each holds a
                                   #   row group or a tar member in memory, and WSL has 10 GB with the aligner
  stream: 4                        # .arrow parts read end to end at once, their audio passing through memory
fetch_min_free_gb: 10              # fetch waits while the data disk has less free, until cut frees it
follow_poll_s: 60                  # how often fetch --follow and cut --follow look for new work
pilot:                             # fetch --pilot, cut, listen: a sample of every phrase to hear before the whole run
  per_phrase: 40                   # matches of each phrase fetched, spread over the sources that hold it
  per_source: 8                    # rows next to each other in one part of a source, so few row groups or tar members
  listen_per_phrase: 8             # kept clips copied to cache/listen/<extract>/, taken from source after source
  level_dbfs: -26.0                # the copies match this over the frames within cut.quiet_below_peak_db of the peak
  seed: 20261001
cut:                               # only a phrase said with a pause on each side is cut (KEHOACH 3.11)
  frame_s: 0.01                    # level frames of the pause test
  guard_s: 0.03                    # next to each aligned bound, out of the test: the aligner's error, a consonant's breath
  min_pause_s: 0.08                # quiet each side needs past the guard; less is running speech, left out
  margin_s: 0.15                   # most a clip keeps past each aligned bound; a shorter pause is cut in its middle
  quiet_below_peak_db: 20.0        # every frame of a pause at least this far under the phrase's loudest frame
  align_batch: 1500                # sentences per aligner run; its peak memory grows with it
extracts:
  hf_extract:
    phrases:                       # matched by their northern reading, so "trợ lí" is "trợ lý"; chụp ảnh stays out,
      - trợ lý                     #   the command E11-T13 adds by text alone
      - bật đèn
      - tắt đèn
      - bật quạt
      - tắt quạt
      - mở cửa
      - đóng cửa
      - tăng âm lượng
      - giảm âm lượng
      - dừng lại
    sources:                       # pinned on first read when unpinned; parquet is the viewer's refs/convert/parquet
                                   #   unless own; copies of yodas2, textless and audioless sets stay out
      - {kind: parquet, repo: thivux/phoaudiobook, revision: e716faf3780d89cdd630b3a778476bb9e1ad316d}
      - {kind: parquet, repo: NhutP/VietSpeech, revision: 35f7d6081b8de7cafa593d741a74068e7d40822c}
      - {kind: parquet, repo: capleaf/viVoice, revision: cb55a42ab775fbff4f78849679b14b6e8934176d}
      - {kind: arrow, repo: nampdn-ai/vietspeech}   # the viewer converted part of it: read its own .arrow
      - {kind: parquet, repo: linhtran92/viet_youtube_asr_corpus_v2, revision: ecde94a62130e6eb4a67845375f18f6787e60b66}
      - {kind: parquet, repo: doof-ferb/LSVSC, revision: 416b1ef54953db4a1c72f1566b2295c029859d10}
      - kind: parquet                # tagged synthetic and tts on the hub: its clips are labelled synth in clips.tsv
        repo: dolly-vn/dolly-audio-1000h-vietnamese
        revision: 1614861fb753346812a8d0654c96b72e4a85609c
        synthetic: true
      - {kind: parquet, repo: doof-ferb/vais1000, revision: 35051e3e3547cac75ceae39c017445bd86b9b359}
      - {kind: parquet, repo: doof-ferb/infore1_25hours, revision: 7f60edb0aa03a6e22de091ff10749e21b33c8a8a}
      - {kind: parquet, repo: doof-ferb/infore2_audiobooks, revision: 8d1895fe7c2b65abe5a9c47e9e7b6d2efc1f940c}
      - {kind: parquet, repo: doof-ferb/VietMed_labeled, revision: 6dcd684b24cefafbfdf647b00cdf3ac13b5f7159}
      - {kind: parquet, repo: doof-ferb/Speech-MASSIVE_vie, revision: 094a186ca0e9246fc7302f169bc8760930175201}
      - {kind: parquet, repo: PhongGoldFish/youtube-center-vietnamese-asr}
      - {kind: parquet, repo: qhuy242/VNAVC}
      - {kind: arrow, repo: LanguaMan/vieneu-tts-140h-dataset}
      - {kind: parquet, repo: doduy1911/voiceNam}
      - {kind: parquet, repo: leduckhai/MultiMed, config: Vietnamese}
      - {kind: parquet, repo: TrangLe2108/DNU-ViSpeech}
      - {kind: parquet, repo: nguyendv02/ViMD_Dataset, own: true}   # own: the repo's parquet, the viewer's is partial
      - {kind: parquet, repo: google/fleurs, config: vi_vn}
      - {kind: parquet, repo: doof-ferb/BibleMMS_vie}
      - {kind: parquet, repo: thangnzt/NgocHuyenViVoice}
      - {kind: parquet, repo: HieuNguyen203/Vietnamese_Medical_Consultation}
      - {kind: parquet, repo: tensorxt/ViMedCSS}
      - {kind: parquet, repo: Cets/audio-logs-vie}
      - kind: local                  # corpora under raw/ that screening kept; VIVOS and Common Voice stay out, their
        repo: local                  #   speakers are split into val and test
        corpora: [speech/fpt_open/, speech/vlsp/, speech/bud500/]
      - kind: tsv_tar                # transcripts in one TSV of <id>\t<text>; audio <id>.wav in tar.gz shards
        repo: speechcolab/gigaspeech2
        revision: 8dc0d0e502b7e6d5649a13cd4b677cf10c0b21e3
        transcripts: data/vi/train_refined.tsv
        shards: data/vi/train/{shard}.tar.gz   # {shard} is the part of an id before its first "-"
      - {kind: tsv_tar, repo: speechcolab/gigaspeech2, transcripts: data/vi/dev.tsv, shards: data/vi/dev.tar.gz}
      - {kind: tsv_tar, repo: speechcolab/gigaspeech2, transcripts: data/vi/test.tsv, shards: data/vi/test.tar.gz}
      - kind: yodas                  # per shard, text/<n>.json of segments and audio/<n>.tar.gz of whole videos
        repo: espnet/yodas2
        hold: true                   # scanned; its 2.1 TB of shards for a quarter of the matches wait for a later fetch
        languages: [vi000, vi100, vi101]
      - kind: manifest_tar           # one zstd JSONL manifest of {audio_filepath, text}; tar.zst shards of the files
        repo: anhtunguyen98/vi-asr-youtube-1582h
        manifest: manifest.jsonl.zst
        shards: shard-*.tar.zst
