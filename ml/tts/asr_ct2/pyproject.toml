[project]
name = "tts-asr-ct2"
version = "0.1.0"
description = "PhoWhisper-large on CTranslate2 behind run.py: hears clips back in batches, text only, for srpipe.core.extract"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1,<10",
    "soundfile>=0.12",
    "scipy>=1.13",
]

[tool.uv]
package = false
