notes: >-
  Fetched by ml/scripts/10_prepare.sh speech/fpt_open, each parquet checked against its LFS sha256. Hours from the
  decoded audio of every row, MP3 at 48 kHz (747 rows at 16 kHz). The mirror carries no speaker ids, so it feeds
  training only, never a test set (KEHOACH 1.3); its card's 100 hours is wrong, the original says about 30.
