consumed_by: [wake]
notes: >-
  Labels only, no audio: the AudioSet clips of raw/noise/dns are named by their YouTube id, and these lists give each
  id its classes, which the wake's noise measurement groups by (KEHOACH 3.11). Every one of the 54 698 DNS AudioSet
  clips appears in them.
