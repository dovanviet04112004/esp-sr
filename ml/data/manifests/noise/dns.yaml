notes: >-
  The 16 kHz noise of the ns branch and the board simulation (KEHOACH 1.2): AudioSet clips named by their YouTube id and
  Freesound clips named by class (door, fan, typing, squeak, breath, munching, copy-machine, dragging). DEMAND ships as
  a separate archive and is not in this one, so nothing here repeats raw/noise/demand. The fullband set of DNS 4 and 5
  is the same material at 48 kHz and three times the size. Azure publishes no checksum, so the sha256 of the first
  download is recorded here.
