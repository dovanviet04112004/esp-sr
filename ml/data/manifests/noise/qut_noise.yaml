notes: >-
  HOME-KITCHEN and HOME-LIVINGB, long recordings of a kitchen and a living room with children, TV and music, as
  noise-alone negatives of wake/noise4 (KEHOACH 3.11). The repository refuses scripted downloads, so the owner saves
