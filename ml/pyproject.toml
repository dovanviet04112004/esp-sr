[project]
name = "srpipe"
version = "0.1.0"
description = "Reference algorithms, data, training and export for esp-sr"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pyroomacoustics>=0.8",
    "pystoi>=0.4.1",
    "pesq>=0.0.4",
    "pyarrow>=25.0.1",
    "zstandard>=0.23",
    "requests>=2.32",
    "numba==0.68.0",
    "llvmlite==0.50.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "torchaudio>=2.4",
]
# ESP-PPQ quantises and exports .espdl for esp-dl; pinned like esp-dl in ai_engine, since model->test()
# on the board proves one exporter and runtime pair (KEHOACH 4.5.1).
espdl = [
    "esp-ppq==1.3.11",
]
# SwiftF0 pitch for the pitch_source trial of KEHOACH 3.11: the simulation and Gate 3 of its runs only.
swiftf0 = [
    "swift-f0==0.3.0",
]
# Praat's overlap-add moves a syllable's F0 with its formants kept: the F0-flip check and tone swap of KEHOACH 3.11.
praat = [
    "praat-parselmouth==0.4.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "webrtcvad-wheels>=2.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srpipe"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/srpipe/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
