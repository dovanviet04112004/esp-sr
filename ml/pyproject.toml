[project]
name = "srpipe"
version = "0.1.0"
description = "Reference algorithms, data, training and export for esp-sr"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pyroomacoustics>=0.8",
    "pystoi>=0.4.1",
    "pesq>=0.0.4",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "torchaudio>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srpipe"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/srpipe/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
