[project]
name = "srhost"
version = "0.1.0"
description = "Host side of esp-sr: watch, record and score what the boards send"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "paho-mqtt>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srhost"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/srhost/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
