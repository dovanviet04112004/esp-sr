# Firmware build of the ci profile, plus the C side of the contract tests (KEHOACH 4.5.8).
name: firmware

on:
  workflow_dispatch:
  push:
    paths: ["firmware/**", "contracts/**", "tools/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "contracts/**", "tools/**", ".github/workflows/firmware.yml"]

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4

      - name: Layering and purity
        run: |
          python3 tools/check_layers.py
          python3 tools/check_purity.py

      - name: Skip the build until firmware/ has a project
        id: guard
        run: |
          if [ -f firmware/CMakeLists.txt ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build the ci profile
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.ci" build
          idf.py size

      - name: dsp_spec and dsp_afe on the host, and C against Python on every golden case
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          pip install pytest==8.3.3 pyyaml==6.0.2
          cmake -S firmware/components/dsp_afe/test_apps/host -B build_host -DCMAKE_BUILD_TYPE=Release
          cmake --build build_host -j
          { ./build_host/dsp_spec/dsp_spec_host contracts/golden; ./build_host/dsp_afe_host_off contracts/golden; ./build_host/dsp_afe_host_on contracts/golden; } | tee host_parity.log
          python firmware/test_apps/parity/pytest_parity.py host_parity.log

      - name: lang_vi and ai_engine shells on the host
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          for c in lang_vi ai_engine; do
            cmake -S firmware/components/$c/test_apps/host -B build_host_$c -DCMAKE_BUILD_TYPE=Release
            cmake --build build_host_$c -j
            ./build_host_$c/${c}_host
          done

      - name: Generated C compiles and round-trips against the fetched cJSON
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          pip install pyyaml==6.0.2 jsonschema==4.23.0
          CJSON_DIR=firmware/managed_components/espressif__cjson/cJSON python -m unittest tools.tests.test_gen_contracts
