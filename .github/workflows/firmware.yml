# Firmware build of the ci profile, plus the C side of the contract tests (KEHOACH 4.5.8).
name: firmware

on:
  workflow_dispatch:
  push:
    paths: ["firmware/**", "contracts/**", "tools/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "contracts/**", "tools/**", ".github/workflows/firmware.yml"]

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4

      - name: Layering and purity
        run: |
          python3 tools/check_layers.py
          python3 tools/check_purity.py

      - name: Skip the build until firmware/ has a project
        id: guard
        run: |
          if [ -f firmware/CMakeLists.txt ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build the ci profile
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.afe;sdkconfig.ci" build
          idf.py size

      - name: dsp_spec, dsp_afe and lang_vi on the host, and C against Python on every golden case
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          pip install pytest==8.3.3 pyyaml==6.0.2
          make parity-host PARITY_PY=python

      - name: ai_engine loader and shells on the host
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          # The host shim hashes model entries with OpenSSL, which the IDF image does not ship.
          apt-get update -qq && apt-get install -y -qq --no-install-recommends libssl-dev
          . "$IDF_PATH/export.sh"
          cmake -S firmware/components/ai_engine/test_apps/host -B build_host_ai_engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build_host_ai_engine -j
          ./build_host_ai_engine/ai_engine_host

      - name: Generated C compiles and round-trips against the fetched cJSON
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          pip install pyyaml==6.0.2 jsonschema==4.23.0
          CJSON_DIR=firmware/managed_components/espressif__cjson/cJSON python -m unittest tools.tests.test_gen_contracts
